[workspace]
resolver = "2"
# The Veilid contract tests build veilid-core with `mock-api`, which must never
# unify into this graph (plan VU decision 6, ADR 0021): their own workspace.
exclude = ["contract/veilid"]
members = [
    "src-tauri",
    "crates/vendor/tauri-plugin-wdio-webdriver",
    "crates/rekindle-types",
    "crates/rekindle-db",
    "crates/rekindle-secrets",
    "crates/rekindle-governance",
    "crates/rekindle-codec",
    "crates/rekindle-gossip",
    "crates/rekindle-route",
    "crates/rekindle-records",
    "crates/rekindle-files",
    "crates/rekindle-link-preview",
    "crates/rekindle-image",
    "crates/rekindle-skin",
    "crates/rekindle-dm",
    "crates/rekindle-calls",
    "crates/rekindle-media-stats",
    "crates/rekindle-media-bwe",
    "crates/rekindle-video",
    "crates/rekindle-video-capture",
    "crates/rekindle-video-libvpx",
    "crates/rekindle-sync",
    "crates/rekindle-protocol",
    "crates/rekindle-crypto",
    "crates/rekindle-game-detect",
    "crates/rekindle-idle",
    "crates/rekindle-voice",
    "crates/rekindle-utils",
    "crates/rekindle-transport",
    "crates/rekindle-cli",
    "crates/rekindle-client",
    "crates/rekindle-tui",
    "crates/rekindle-ipc",
    "crates/rekindle-node",
    # Decomposed-harvest crates (added per `.claude/plans/memoized-dazzling-torvalds.md`).
    "crates/rekindle-audit",
    "crates/rekindle-events",
    "crates/rekindle-idempotency",
    "crates/rekindle-outbox",
    "crates/rekindle-lifecycle",
    "crates/rekindle-record-pool",
    "crates/rekindle-mek-rotation",
    "crates/rekindle-governance-runtime",
    "crates/rekindle-channel",
    "crates/rekindle-presence",
    "crates/rekindle-vault",
    "crates/rekindle-analytics",
    "crates/rekindle-asql",
    "crates/rekindle-netsim",
    "xtask",
]
# W-1 #12 — `rekindle-cli` and `rekindle-node` are sister artifacts
# from the merged feat/rekindle-cli work. They are NOT shipped with the
# Tauri app and use the OS keyring as their secret store (rejected as
# primary store for vulnerable users — Stronghold is primary in the
# Tauri path). Excluding them from default builds keeps `cargo build`
# focused on what the shipped app needs.
#
# To build the daemon: `cargo build -p rekindle-node`
# To build the CLI:    `cargo build -p rekindle-cli`
#
# `rekindle-video-libvpx` is likewise excluded from default-members: its
# real encoder needs a system libvpx (C dep), gated behind its DEFAULT-OFF
# `libvpx` feature. Keeping it out of default-members means a bare
# `cargo build` never compiles it; `cargo build --workspace` does but, with
# the feature off, pulls no C dependency. Build the encoder explicitly:
#   VPX_STATIC=1 cargo build -p rekindle-video-libvpx --features libvpx
default-members = [
    "src-tauri",
    "crates/rekindle-types",
    "crates/rekindle-secrets",
    "crates/rekindle-governance",
    "crates/rekindle-codec",
    "crates/rekindle-gossip",
    "crates/rekindle-route",
    "crates/rekindle-records",
    "crates/rekindle-files",
    "crates/rekindle-link-preview",
    "crates/rekindle-image",
    "crates/rekindle-skin",
    "crates/rekindle-dm",
    "crates/rekindle-calls",
    "crates/rekindle-video",
    "crates/rekindle-video-capture",
    "crates/rekindle-sync",
    "crates/rekindle-protocol",
    "crates/rekindle-crypto",
    "crates/rekindle-game-detect",
    "crates/rekindle-idle",
    "crates/rekindle-voice",
    "crates/rekindle-utils",
    "crates/rekindle-transport",
    # Decomposed-harvest crates (shipped with the Tauri app).
    "crates/rekindle-audit",
    "crates/rekindle-events",
    "crates/rekindle-idempotency",
    "crates/rekindle-outbox",
    "crates/rekindle-lifecycle",
    "crates/rekindle-record-pool",
    "crates/rekindle-mek-rotation",
    "crates/rekindle-governance-runtime",
    "crates/rekindle-channel",
    "crates/rekindle-presence",
    "crates/rekindle-vault",
    "crates/rekindle-analytics",
    "crates/rekindle-asql",
]

[workspace.dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tokio = { version = "1", features = [ "full" ] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
thiserror = "2"
anyhow = "1"
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
capnp = "0.20"
capnpc = "0.20"
hex = "0.4"
rand = "0.8"
# Formally-verified ML-KEM-768 (HACL*/libcrux line, AVX2/Neon SIMD).
# Exact pin — 0.0.x semver makes no stability promise; audit on bump.
libcrux-ml-kem = "=0.0.12"

# Optimize Argon2 even in dev builds — rekindle-vault's KDF is the main
# bottleneck on first login / unlock. Other crypto crates use aws-lc-rs or
# pure-Rust impls that are fast enough in dev.
[profile.dev.package.argon2]
opt-level = 3

# curve25519-dalek selects its AVX2 backend on x86-64 (`build.rs` defaults
# to `simd` there; `src/backend/mod.rs` `get_selected_backend` picks AVX2 at
# run time), and those intrinsics at opt-level 0 are slow: measured on the
# Linux test machine (Xeon E3-1545M v5, rustc 1.92), the debug walk of 130
# signed ops (`rekindle-governance-runtime/tests/walk_cpu_budget.rs`) took
# 4617-4742 ms; with this override 0.10-0.13 s; with the serial backend
# forced instead 0.30-0.31 s (2026-11-17). Every Ed25519/X25519 call in a
# debug build pays it, so the override is for the app, not only the test.
# The name covers both majors in the lock (4.1.3 and 5.0.0).
[profile.dev.package.curve25519-dalek]
opt-level = 3

# veilid-core 0.5.8 holds monomorphic entry points for its hot dependencies
# (lz4 among them) in veilid-core-optimized, "compiled at full optimization
# in every build profile" (its Cargo.toml); a package override reaches only
# the package's own code, so name it here for Rekindle's dev builds.
[profile.dev.package.veilid-core-optimized]
opt-level = 3

[workspace.lints.rust]
warnings = "deny"
unused-imports = "deny"
dead-code = "deny"
unused-variables = "deny"
unsafe-op-in-unsafe-fn = "warn" # Rust 2024: explicit unsafe blocks in unsafe fns

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# --- Pedantic: allow legitimately noisy lints ---
module-name-repetitions = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"
must-use-candidate = "allow"
return-self-not-must-use = "allow"
struct-excessive-bools = "allow"
items-after-statements = "allow"     # use statements in fn bodies (common in tests)
similar-names = "allow"              # ct/pt, idx/id pairs — too many false positives
doc-markdown = "allow"               # noisy for technical codebases
doc-lazy-continuation = "allow"      # multi-line doc comment formatting
trivially-copy-pass-by-ref = "allow" # serde serialize_with/skip_serializing_if mandate fn(&T)

# --- Security: cherry-picked restriction lints ---
dbg-macro = "deny"                  # no leftover dbg!() in production
todo = "deny"                       # no todo!() in shipped code
unimplemented = "deny"              # no unimplemented!() in shipped code
undocumented-unsafe-blocks = "deny" # every unsafe block needs // SAFETY: comment
print-stdout = "warn"               # prefer tracing over println!
print-stderr = "warn"               # prefer tracing over eprintln!

# veilid-core 0.5.8 plus one fix, pinned by commit, until a Veilid release
# carries it (ADR 0017): a route chosen for a reply or a safety route is held
# until it is used, and a release of a held route drains instead of removing
# it ("Invalid target: route key does not exist", dropped rehydration
# requests); a route marked for release is not saved. Branch
# rekindle/v0.5.8-route-drain = the upstream v0.5.8 tree (snapshot dcf0b315)
# + that commit (91453e97); the same change is the upstream MR. Keep
# deny.toml's allow-git and .cargo/config.toml in sync. 0.5.8's table-store
# migration is one-way: a 0.5.7 build cannot open its storage (SCHEMA_VERSION
# resets all three stores together on the bump).
[patch.crates-io]
veilid-core = { git = "https://github.com/radicalkjax/veilid.git", rev = "91453e97e8ef467aa7c7c3b5e871a7ed5738f941" }
# libdbus-sys 0.2.7's vendored build (Linux; vendored is forced by
# keyring-manager, a veilid-core dependency) omits HAVE_POLL, so libdbus
# emulates poll() with select() and FD_SET of a descriptor >= 1024 writes
# past the stack fd_set: the app aborted on Linux ("stack smashing
# detected", plan E7.13 W7). dbus-rs issue #522, fixed upstream by PR #523,
# commit dd78d826 (one line: `config.enable("HAVE_POLL")`), unreleased as of
# 2026-11-17 (crates.io latest 0.2.7). Drop this once a release carries it.
# Keep deny.toml's allow-git in sync.
libdbus-sys = { git = "https://github.com/diwic/dbus-rs", rev = "dd78d8267498300d981df2859f027ddfedd74b0a" }
