[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Custom workspace tasks beyond what cargo provides natively. See README at /docs/contributor/architecture-rules.md."
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
# `check-duplicate-constants` parses real Rust rather than pattern-matching
# it. A line scanner cannot tell the `;` in `const K: [u8; 32] = …;` from
# the one ending the statement, nor a `#[cfg(test)]` fixture from shipped
# code — and getting that wrong in a CI gate means false failures. syn and
# quote are already in the lockfile (every derive macro pulls them), so
# this adds a dependency edge, not a crate. `span-locations` is
# deliberately NOT enabled on proc-macro2: feature unification would turn
# it on for every proc macro in the workspace build.
# `visit` + `proc-macro2` serve `check-domain-literals`, which walks every
# literal including those inside macro token streams. Line numbers come from
# locating the literal's source text (no `span-locations`, see above).
syn = { version = "2", features = ["full", "parsing", "printing", "visit"] }
quote = "1"
proc-macro2 = "1"
# `gen-skin-registry` / `check-skin-registry` (plan E7.7.1) write and compare
# the closed token registry's artefacts from the crate that owns it.
rekindle-skin = { path = "../crates/rekindle-skin" }
# `import-xfire-data` (plan E7.7.3 "Xfire app data"): `icons.dll` is read
# as PE resource data, never loaded (MIT; std only, no mmap); the sound
# packs' `sounds.xml` with the same XML reader rekindle-skin uses (MIT);
# the packs inflated and CRC-checked (already in the tree through png);
# provenance hashes; the icon PNG encoder; the bank's manifest types.
pelite = { version = "0.10.0", default-features = false, features = ["std"] }
quick-xml = "0.38"
miniz_oxide = "0.8"
crc32fast = "1.5"
blake3 = "1"
rekindle-image = { path = "../crates/rekindle-image" }
rekindle-types = { path = "../crates/rekindle-types" }
