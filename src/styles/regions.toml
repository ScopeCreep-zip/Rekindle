# The region map (plan E7.7.0; regions and the validator are E7.7.1).
#
# One entry per selector that colours text with a themeable token: `on`
# names every ground that text is drawn on, so E7.7.1's validator can measure
# each text-on-ground pair under every skin. A ground is a `@theme` colour
# token, or `<token> <N>% over <ground>` for a tint, composited in
# gamma-encoded sRGB like `color-mix(in srgb, …)`. The ground of a text rule
# usually comes from an ancestor (`.reply-preview-icon` sits on
# `.reply-preview`'s tint), so it is authored here from the component tree,
# never inferred from the CSS.
#
# Hover overlays (`color-mix(in srgb, var(--color-xfire-overlay) 5%,
# transparent)`) are not grounds: they are a few percent over the ground named.
# A ground that is itself an overlay or shade mix (the menu bar's 10% raise)
# is declared as that tint.
# A video tile's text sits on a 60% scrim over arbitrary frames; its worst
# case, a white frame, is written `scrim 60% over text-on-fill`.
#
# `graphic = true` marks a selector whose colour paints a graphic rather
# than text (the status-dot shapes): WCAG 1.4.11 asks 3:1 of it, where text
# needs 4.5:1 (1.4.3). The presence dot glyph (`●`, `aria-hidden`) is one.
# `cargo xtask check-contrast-pairs` measures every declared pair on the
# default (`@theme`) palette, and every pair whose text the light base
# revalues on the light base (plan E7.7.0a).
#
# `cargo xtask check-declared-grounds` fails on a token-coloured text selector
# without an entry, on an entry for any other selector, and on a malformed
# ground.

