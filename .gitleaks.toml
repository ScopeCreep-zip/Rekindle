# gitleaks — secret-scanning configuration.
# Spec: https://github.com/gitleaks/gitleaks
#
# Run with:  gitleaks git --config .gitleaks.toml --redact      (full history)
#            gitleaks git --staged --config .gitleaks.toml      (pre-commit)
#
# We extend the default ruleset with project-specific allowlists for
# false positives (test fixtures with deliberately-weak keys, hex
# strings in docs, etc.).

title = "Rekindle gitleaks config"

# Use the upstream default rule pack as a baseline.
[extend]
useDefault = true

# ─── Repository-wide allowlist ──────────────────────────────────────────
[[allowlists]]
description = "Legacy reverse-engineering tree, changelog, SBOMs and lockfiles"
paths = [
    '''legacy/.*''',
    '''CHANGELOG\.md$''',
    '''.*\.cdx\.json$''',
    # Generated lockfiles — high false-positive rate, rarely the real
    # source of leaks (lockfile content is hashes of registry assets).
    '''Cargo\.lock$''',
    '''pnpm-lock\.yaml$''',
    '''flake\.lock$''',
]

[[allowlists]]
description = "Test fixtures with deliberately weak / placeholder keys"
regexes = [
    # Common Ed25519 / X25519 test seed patterns
    '''(0102030405060708)+''',
    '''(deadbeef)+''',
    '''0xabcd''',
    '''AABBCCDDEEFF''',
    # Project-specific placeholders
    '''VLD0:[A-Za-z0-9_-]{0,8}\\.\\.\\.''',
    '''\\b[Pp]laceholder[Kk]ey\\b''',
    '''\\b[Pp]laceholder[Tt]oken\\b''',
]

# ─── Custom rules in addition to the default pack ───────────────────────

[[rules]]
id = "stronghold-vault-leak"
description = "Stronghold vault file content (binary header)"
regex = '''STRONGHOLD\x00\x00'''
keywords = ["STRONGHOLD"]

[[rules]]
id = "ed25519-private-key-hex"
description = "Possible 64-byte Ed25519 private key in hex"
# 128 hex chars (64 bytes) after an Ed25519 secret-key name.
regex = '''(?i)(?:ed25519[_-]?(?:secret|private|priv)|priv_key|secret_key)[\s:=\"']*([a-f0-9]{128})'''
keywords = ["ed25519", "secret_key", "priv_key", "private_key"]

[[rules]]
id = "x25519-private-key-hex"
description = "Possible 32-byte X25519 private key in hex"
regex = '''(?i)(?:x25519[_-]?(?:secret|private|priv)|x25519_priv)[\s:=\"']*([a-f0-9]{64})'''
keywords = ["x25519"]

[[rules]]
id = "stronghold-passphrase"
description = "Hard-coded Stronghold passphrase"
regex = '''(?i)stronghold[_-]?passphrase[\s:=\"']*([^\"'\s][^\"']{8,})'''
keywords = ["stronghold_passphrase", "STRONGHOLD_PASSPHRASE"]

# The canonical static test fixtures (owner ruling 2026-11-26: "identify our regular test
# identities and items and make sure they're static so that we can make detection rules to be
# mindful of them"). The values live once in crates/rekindle-test-fixtures/src/lib.rs, each built
# from a documented ramp no real key or token has: hex fixtures repeat `abcdef1234567890`, base32
# tokens start `abcdefghijklmnopqrstuvwx`. Both values here are also the ones gitleaks flagged in
# history (HEX_KEY_64: rekindle-client fmt.rs and the rekindle-cli helpers tests; FRIEND_TOKEN:
# rekindle-types tests/golden/dto.json). Only these exact secrets, and only in crate source,
# tests and goldens, are allowed (AND): any other value in a test, or these values anywhere
# else, is still reported. `cargo xtask check-test-fixtures` keeps tests on the canonical crate.
#
# generic-api-key (default pack) with the fixture-aware allowlists. They are attached to the rule,
# not global: gitleaks applies a global allowlist's `paths` before its `condition`, so a global
# AND entry would drop every secret in those paths.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Canonical static test fixtures (rekindle-test-fixtures), owner ruling 2026-11-26"
condition = "AND"
regexTarget = "secret"
regexes = [
    '''^(?:abcdef1234567890){4}$''',
    '''^abcdefghijklmnopqrstuvwx2q$''',
]
paths = [
    '''(?:^|/)crates/[\w-]+/(?:src|tests)/.+\.rs$''',
    '''(?:^|/)crates/[\w-]+/tests/golden/[\w-]+\.json$''',
]

# A Rust identifier quoted in a dated research note, read by generic-api-key as a secret.
[[rules.allowlists]]
description = "Rust identifier in docs/research/2026-10-04-standards-audit.md"
condition = "AND"
regexTarget = "secret"
regexes = ['''^to_legacy_u32$''']
paths = ['''(?:^|/)docs/research/2026-10-04-standards-audit\.md$''']
