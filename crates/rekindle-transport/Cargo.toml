[package]
name = "rekindle-transport"
version = "0.1.0"
edition = "2021"
description = "Unified network transport layer for Rekindle, over the Veilid-free record, route and message ports"
license = "MIT"

[lints]
workspace = true

[dependencies]
# Workspace
rekindle-codec = { path = "../rekindle-codec" }
rekindle-crypto = { path = "../rekindle-crypto" }
rekindle-dm = { path = "../rekindle-dm" }
rekindle-events = { path = "../rekindle-events" }
rekindle-lifecycle = { path = "../rekindle-lifecycle" }
rekindle-route = { path = "../rekindle-route" }
rekindle-secrets = { path = "../rekindle-secrets" }
rekindle-types = { path = "../rekindle-types" }
rekindle-utils = { path = "../rekindle-utils", features = [ "retry" ] }
# Tier-5 gossip primitives. rekindle-gossip is transport-agnostic pure
# logic ("does not call app_message itself; the integration layer plumbs
# the broadcast helpers into Veilid") and this crate is that integration
# layer for the daemon track — a downward edge, matching the desktop
# track's use of the same primitives. Without it this crate carried its
# own fanout/Lamport/rate-limit copies, which had already drifted from
# the epidemic-broadcast parameters both tracks must agree on.
rekindle-gossip = { path = "../rekindle-gossip" }
# Constant-time tag comparison for voice packet HMACs. Never
# hand-rolled: a manual XOR/OR loop can be optimised back into an
# early exit, which is the timing oracle it was meant to prevent.
subtle = "2"
# The ports' Veilid implementation (`ports::VeilidPorts`, the one Veilid
# startup path) and the typed record helpers over `RecordPort`. This crate
# names no Veilid type (plan C9.1); it links Veilid only through this edge
# (ADR 0014). Unidirectional; rekindle-protocol must never depend on
# rekindle-transport.
rekindle-protocol = { path = "../rekindle-protocol" }
# The record, route and app-message ports (`rekindle_records::port`).
rekindle-records = { path = "../rekindle-records" }
rekindle-sync = { path = "../rekindle-sync" }
# The friend and 1:1 operations (plan E2.1) store through the identity's
# database (`rekindle_db::repo`, Tier 3; no SQL leaves the storage crates)
# and audit through `rekindle_audit::AuditKind` (Tier 2).
rekindle-audit = { path = "../rekindle-audit" }
rekindle-db = { path = "../rekindle-db" }

# Async
async-trait = "0.1"
backoff = "0.4"
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"

# Serialization — postcard for wire, serde for trait bounds
postcard = { version = "1", features = [ "use-std" ] }
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
aes-gcm = "0.10"
blake3 = "1"
ed25519-dalek = { version = "2", features = [ "rand_core", "zeroize" ] }
hkdf = "0.12"
rand = { workspace = true }
sha2 = "0.10"
zeroize = { version = "1", features = [ "derive" ] }

# Data structures
bitflags = { version = "2", features = [ "serde" ] }
indexmap = "2"
parking_lot = { workspace = true }

# The safety number's scannable form as a QR code (plan E2.3); matrix
# only, no renderer: every frontend draws the modules itself.
qrcode = { version = "0.14", default-features = false }

# Identity generation
uuid = { version = "1", features = [ "v4", "v7", "fast-rng" ] }

# Logging
hex = "0.4"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The frame size tests build real bundles over a temporary database.
rekindle-db = { path = "../rekindle-db", features = [ "test-support" ] }
proptest = "1"
tokio = { workspace = true, features = [ "test-util", "macros" ] }
