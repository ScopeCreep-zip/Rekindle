[package]
name = "rekindle-friendship"
version = "0.1.0"
edition = "2021"
description = "Three-tier inbox-scan coordinator (watch + 30s poll + direct) for Rekindle friendships"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [ "sync", "macros", "time", "rt" ] }
tokio-util = "0.7"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [ "sync", "macros", "time", "rt", "rt-multi-thread", "test-util" ] }
