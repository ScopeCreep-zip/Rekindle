[package]
name = "rekindle-events"
version = "0.1.0"
edition = "2021"
description = "Reusable event primitives: BLAKE3 dedup, subscription state, state effects, monotonic journal — hoisted from rekindle-transport::subscriptions."

[lints]
workspace = true

[dependencies]
blake3 = "1"
parking_lot = { workspace = true }
rand = { workspace = true }
rekindle-types = { path = "../rekindle-types" }
rekindle-utils = { path = "../rekindle-utils" }
serde = { workspace = true }
tokio = { workspace = true, features = [ "sync" ] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [ "macros", "rt" ] }
