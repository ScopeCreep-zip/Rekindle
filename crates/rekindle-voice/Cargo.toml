[package]
name = "rekindle-voice"
version = "0.1.0"
edition = "2021"
description = "Voice chat engine with Opus codec for Rekindle"

[lints]
workspace = true

[dependencies]
aec3 = "0.1"
bincode = "1"
bytes = { workspace = true }
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }
dasp_sample = "0.11"
ed25519-dalek = "3"
nnnoiseless = "0.5"
opus = "0.3"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# RFC 9605 SFrame (media_crypto) — every voice frame is sealed under
# its sender's key, for calls and community channels alike.
rekindle-secrets = { path = "../rekindle-secrets" }
zeroize = { version = "1", features = [ "derive" ] }
# Phase 14 additions: election module needs BLAKE3 + hex; voice session
# deps trait + adapter wiring need async-trait.
async-trait = "0.1"
blake3 = "1"
hex = { workspace = true }
# Media-plane liveness ledger (liveness.rs) — sync interior mutability
# shared across the send/receive loops and the signaling adapter.
parking_lot = { workspace = true }
rekindle-utils = { path = "../rekindle-utils" }
# Phase 14.k — voice signaling handlers need protocol envelope types
# (CommunityEnvelope / ControlPayload) + permission bit constants.
rekindle-lifecycle = { path = "../rekindle-lifecycle" }
rekindle-codec = { path = "../rekindle-codec" }
rekindle-types = { path = "../rekindle-types" }
tokio-util = "0.7"
# The single RFC 3550 / RFC 3611 reception model. The jitter buffer used
# to carry its own copy of the interarrival estimator; one estimator,
# read by both the adaptive target and the receiver report.
rekindle-media-stats = { path = "../rekindle-media-stats" }
rekindle-media-bwe = { path = "../rekindle-media-bwe" }

[dev-dependencies]
# Paused-clock tests for the media-key delivery backoff (plan C7.22).
tokio = { workspace = true, features = [ "test-util" ] }
# Phase 7 Week 26 — voice latency benchmark (architecture line 4147,
# target <100ms mouth-to-ear).
criterion = { version = "0.5", features = [ "html_reports" ] }

[[bench]]
name = "latency"
harness = false
