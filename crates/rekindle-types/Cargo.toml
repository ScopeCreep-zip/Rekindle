[package]
name = "rekindle-types"
version = "0.1.0"
edition = "2021"
description = "Shared type definitions for Rekindle community system"
license = "MIT"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
hex = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"

[dev-dependencies]
postcard = { version = "1", features = [ "use-std" ] }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "macros", "rt" ] }
toml = "0.9"
