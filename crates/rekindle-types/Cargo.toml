[package]
name = "rekindle-types"
version = "0.1.0"
publish = false
edition = "2021"
description = "Shared type definitions for Rekindle community system"
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
hex = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = [ "v7", "serde" ] }
zeroize = { version = "1", features = [ "serde" ] }

[features]
# `presence::fixture`: test builders for other crates' tests.
fixture = [  ]

[dev-dependencies]
postcard = { version = "1", default-features = false, features = [ "use-std" ] }
rekindle-test-fixtures = { path = "../rekindle-test-fixtures" }
serde_json = { workspace = true }
tokio = { workspace = true, features = [ "macros", "rt" ] }
toml = "0.9"
