[package]
name = "rekindle-node"
version = "0.1.0"
edition = "2021"
description = "Rekindle daemon — IPC bus, state management, and Veilid bridge"
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "rekindled"
path = "src/bin/rekindled.rs"

[dependencies]
# Workspace crates — rekindle-transport is the SOLE Veilid boundary.
# rekindle-node NEVER imports veilid-core directly.
rekindle-transport = { path = "../rekindle-transport" }
rekindle-types = { path = "../rekindle-types" }
# The IPC bus (protocol, Noise, client/server, event router).
rekindle-ipc = { path = "../rekindle-ipc" }
rekindle-utils = { path = "../rekindle-utils", features = [ "log-scrub", "config" ] }
# Tier-6 CRDT state type for the daemon's cached governance merge.
rekindle-governance = { path = "../rekindle-governance" }
# The v2.0 governance lifecycle (origin, bootstrap, join, segments,
# apply). This crate implements its `GovernanceRuntimeDeps` so the
# daemon runs the same flat-SMPL governance as the Tauri host.
rekindle-governance-runtime = { path = "../rekindle-governance-runtime" }
# CommunityEnvelope only — the gossip payload type crossing the Deps
# boundary. No veilid_core types are named from this crate.
rekindle-db = { path = "../rekindle-db" }
rekindle-lifecycle = { path = "../rekindle-lifecycle" }
rekindle-codec = { path = "../rekindle-codec" }
rekindle-protocol = { path = "../rekindle-protocol" }
rekindle-records = { path = "../rekindle-records" }
# Tier 5. The shared gossip stack — Cap'n Proto `CommunityEnvelope`
# over unframed `app_message`, the format the desktop already used.
# Before this the daemon had its own postcard `GossipPayload` and the
# two tracks could not read each other's broadcasts at all.
rekindle-gossip = { path = "../rekindle-gossip" }
# Tier 5. The community presence orchestrators — registry scan, W26
# verification, gossip overlay rebuild. Only src-tauri implemented
# `CommunityPresenceDeps`, which is why the daemon had no roster and
# read the v1.0 member index instead.
rekindle-presence = { path = "../rekindle-presence" }
# Deterministic-rotator MEK rotation (communities-channels.md). The
# daemon implements its `MekDistributeDeps` so a departure rotates the
# key on this track too; before this it only logged the intent.
rekindle-mek-rotation = { path = "../rekindle-mek-rotation" }
# MediaEncryptionKey — the key type `MekDistributeDeps` exchanges.
rekindle-crypto = { path = "../rekindle-crypto" }

# Async runtime
futures = { workspace = true }
tokio = { workspace = true }
# CancellationToken and TaskTracker: tokio's graceful-shutdown primitives.
tokio-util = { version = "0.7", features = [ "rt" ] }

# Serialization
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# IPC transport encryption (Noise IK)
snow = { git = "https://github.com/mcginty/snow", rev = "295dc7b" }

# Crypto utilities
aes-gcm = "0.10"
blake3 = "1"
rand = "0.8"
zeroize = { version = "1", features = [ "derive" ] }

# Identifiers
uuid = { version = "1", features = [ "v4", "v7", "serde" ] }

# Safe syscalls
rustix = { version = "1", features = [ "process" ] }

# Logging and errors
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# `rekindled` command line and log file
clap = { version = "4", features = [ "derive", "std", "help", "usage", "error-context" ] }
tracing-appender = "0.2"

# systemd integration (sd_notify READY=1, watchdog keepalive)
sd-notify = "0.4"

# OS keyring for signing key storage
hex = "0.4"
keyring = { version = "3", default-features = false, features = [ "apple-native", "windows-native", "linux-native" ] }


[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = [ "test-util", "macros" ] }
