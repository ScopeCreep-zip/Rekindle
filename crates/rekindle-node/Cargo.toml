[package]
name = "rekindle-node"
version = "0.1.0"
edition = "2021"
description = "Rekindle daemon — orchestrates transport-ipc, chat, storage, and Veilid"
license = "MIT"

[lints]
workspace = true

[dependencies]
# Workspace crates
rekindle-chat = { path = "../rekindle-chat" }
rekindle-keys = { path = "../rekindle-keys" }
rekindle-transport = { path = "../rekindle-transport" }
rekindle-storage = { path = "../rekindle-storage" }
rekindle-types = { path = "../rekindle-types" }
rekindle-transport-ipc = { path = "../rekindle-transport-ipc" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Crypto utilities
blake3 = "1"

# LRU cache for idempotency (O(1) eviction)
lru = "0.14"

# Identifiers
uuid = { version = "1", features = ["v4", "v7", "serde"] }
libc = "0.2"

# Logging and errors
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi"] }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# systemd integration
sd-notify = "0.4"

# Filesystem config hot-reload
notify = "7"

# OS keyring for signing key storage
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
hex = "0.4"

# Time formatting
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }

# Sandbox (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libseccomp = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
