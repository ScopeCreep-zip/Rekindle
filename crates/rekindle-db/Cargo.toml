[package]
name = "rekindle-db"
version = "0.1.0"
edition = "2021"
description = "Rekindle's SQLite schema, data root, node lock and shared repositories (Tier 3)"
license = "MIT"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
hex = { workspace = true }
parking_lot = { workspace = true }
rekindle-audit = { path = "../rekindle-audit" }
# The 1:1 ratchet runs `SessionRecord` inside `Db::call`, one transaction
# per message (plan E2.3); rekindle-crypto is cross-cutting.
rekindle-crypto = { path = "../rekindle-crypto" }
rekindle-types = { path = "../rekindle-types" }
rekindle-utils = { path = "../rekindle-utils", features = [ "paths" ] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = "1"

# Vendored tokio-rusqlite: one background thread per connection.
rekindle-asql = { path = "../rekindle-asql" }

# SQLCipher, as `rekindle-vault` builds it: feature unification gives the
# whole process one libsqlite3, and SQLCipher wins (plan G5).
rusqlite = { version = "0.39", features = [ "bundled-sqlcipher-vendored-openssl" ] }

# The ratchet fixtures (a party with its own database, a seeded
# generator), for the crates that test frames over it (plan E2.3).
rand = { workspace = true, optional = true }

[features]
test-support = [ "dep:rand" ]

[dev-dependencies]
rand = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = [ "macros", "rt", "rt-multi-thread" ] }
