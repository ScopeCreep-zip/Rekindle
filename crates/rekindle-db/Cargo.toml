[package]
name = "rekindle-db"
version = "0.1.0"
publish = false
edition = "2021"
description = "Rekindle's SQLite schema, data root, node lock and shared repositories (Tier 3)"
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
hex = { workspace = true }
parking_lot = { workspace = true }
rekindle-audit = { path = "../rekindle-audit" }
# The 1:1 ratchet runs `SessionRecord` inside `Db::call`, one transaction
# per message (plan E2.3); rekindle-crypto is cross-cutting.
rekindle-crypto = { path = "../rekindle-crypto" }
rekindle-types = { path = "../rekindle-types" }
rekindle-utils = { path = "../rekindle-utils", features = [ "paths" ] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = "1"

# Vendored tokio-rusqlite: one background thread per connection.
rekindle-asql = { path = "../rekindle-asql" }

# The ratchet fixtures (a party with its own database, a seeded
# generator), for the crates that test frames over it (plan E2.3).
rand = { workspace = true, optional = true }
# The fixtures read the packed prekey values back; the storage itself
# packs nothing (`rekindle_crypto::signal::prekey_record::Publish` does).
rekindle-codec = { path = "../rekindle-codec", optional = true }

# SQLCipher, as `rekindle-vault` builds it: feature unification gives the
# whole process one libsqlite3, and SQLCipher wins (plan G5). Its page
# cipher's C crypto provider is chosen per target (plan SC1 slice 3):
# Apple builds take CommonCrypto (`bundled-sqlcipher` alone defines
# SQLCIPHER_CRYPTO_CC and links Security.framework, libsqlite3-sys 0.37
# build.rs:219-222), so `openssl-sys` is not in them; every other target
# keeps the static, pinned OpenSSL from `openssl-src` (without it,
# build.rs:223-226 links a system `libcrypto` dynamically, and on Windows
# panics without OPENSSL_DIR, build.rs:170-171).
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.39", features = [ "bundled-sqlcipher" ] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.39", features = [ "bundled-sqlcipher-vendored-openssl" ] }

[features]
test-support = [ "dep:rand", "dep:rekindle-codec" ]

[dev-dependencies]
rand = { workspace = true }
rekindle-codec = { path = "../rekindle-codec" }
tempfile = "3"
tokio = { workspace = true, features = [ "macros", "rt", "rt-multi-thread" ] }
