[package]
name = "rekindle-records"
version = "0.1.0"
publish = false
edition = "2021"
description = "DHT record lifecycle, SMPL sizing, and read backoff for Rekindle v2.0"
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
rekindle-codec = { path = "../rekindle-codec" }
rekindle-types = { path = "../rekindle-types" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [ "macros", "sync" ] }

[dev-dependencies]
parking_lot = { workspace = true }
proptest = "1"
tokio = { workspace = true, features = [ "macros", "rt", "sync" ] }
