[package]
name = "rekindle-e2e-server"
version = "0.0.1"
edition = "2021"
description = "E2E test HTTP bridge — exposes Tauri IPC commands for Playwright"

[[bin]]
name = "e2e-server"
path = "src/bin/e2e_server.rs"

[lints]
workspace = true

[dependencies]
axum = "0.8"
rekindle-db = { path = "../rekindle-db" }
rekindle-node = { path = "../rekindle-node" }
rekindle-utils = { path = "../rekindle-utils", features = [ "log-scrub" ] }
rekindle_lib = { package = "rekindle-desktop", path = "../../src-tauri" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = [ "cors" ] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
