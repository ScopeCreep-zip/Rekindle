[package]
name = "rekindle-video-capture"
version = "0.1.0"
edition = "2021"
description = "Native Linux camera capture + VP9 realtime encode for Rekindle (GStreamer)"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

# The whole module tree is #[cfg(target_os = "linux")]; off-Linux this
# crate compiles to an empty lib (cfg'd-out code is not dead code).
# GStreamer is the only maintained Rust capture stack with automatic
# MJPEG/YUYV negotiation and a realtime-CBR VP9 encoder (vp9enc
# deadline=1 end-usage=cbr) — see plan rosy-bouncing-kahn R1/R3.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
