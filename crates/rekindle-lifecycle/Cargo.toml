[package]
name = "rekindle-lifecycle"
version = "0.1.0"
edition = "2021"
description = "9-state application lifecycle FSM + TransportGuard RAII for Rekindle"

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = [ "std" ] }
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [ "sync", "macros", "time" ] }
tokio-util = { version = "0.7", features = [ "rt" ] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [ "sync", "rt", "rt-multi-thread", "macros", "time" ] }
