[package]
name = "rekindle-game-detect"
version = "0.1.0"
edition = "2021"
description = "Cross-platform game detection via process scanning for Rekindle"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
open = "5"
rekindle-lifecycle = { path = "../rekindle-lifecycle" }
rekindle-utils = { path = "../rekindle-utils" }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.32"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
tokio = { workspace = true, features = [ "test-util", "macros", "rt-multi-thread" ] }
