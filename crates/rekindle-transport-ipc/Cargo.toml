[package]
name = "rekindle-transport-ipc"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Encrypted IPC bus transport for the Rekindle messaging platform"
license = "MIT"

[lints]
workspace = true

[features]
default = []
bench-harness = ["dep:criterion", "dep:tracing-subscriber", "dep:tempfile"]

[dependencies]
rekindle-types = { path = "../rekindle-types" }
rekindle-aead  = { path = "../rekindle-aead", features = ["aegis"] }
rekindle-hash  = { path = "../rekindle-hash", features = ["sha256-mb"] }
rekindle-transport-buff = { path = "../rekindle-transport-buff", features = ["tokio"] }
crossbeam       = "0.8"
crossbeam-utils = "0.8"

tokio       = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros", "time"] }
tokio-util  = "0.7"
bytes       = "1"
postcard    = { version = "1", features = ["use-std"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
snow        = { git = "https://github.com/mcginty/snow", rev = "295dc7b" }
aws-lc-rs   = { version = "1.16", features = ["alloc"] }
rayon       = "1"
parking_lot = { workspace = true }
dashmap     = "6"
smallvec    = "1"
zeroize     = { version = "1", features = ["zeroize_derive"] }
blake3      = { version = "1", features = ["rayon"] }
rustix      = { version = "1", features = ["net", "fs", "process"] }
hex         = "0.4"
uuid        = { version = "1", features = ["v7", "serde"] }
tracing     = { workspace = true }
thiserror   = { workspace = true }
subtle      = "2"
static_assertions = "1"
bitflags = "2"
libc        = "0.2"
criterion   = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tempfile    = { version = "3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
criterion = "0.7"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
tempfile = "3"

[[bench]]
name = "v3_crypto_primitives"
path = "benches/v3/crypto_primitives.rs"
harness = false
required-features = ["bench-harness"]

[[bench]]
name = "v3_socket_e2e"
path = "benches/v3/socket_e2e.rs"
harness = false
required-features = ["bench-harness"]

[[bench]]
name = "v3_calibrated_floors"
path = "benches/v3/calibrated_floors.rs"
harness = false
required-features = ["bench-harness"]
