[package]
name = "rekindle-skin"
version = "0.1.0"
edition = "2021"
description = "The skin package format rekindle-skin/1: the strict in-memory zip walk, the manifest rules, the token profile and the closed token registry (plan E7.7.1)"
license = "MIT"
# One test binary: `tests/skin.rs` holds the shared zip writer and both suites.
autotests = false

[lints]
workspace = true

[dependencies]
crc32fast = "1.5"
rekindle-types = { path = "../rekindle-types" }
serde = { workspace = true }
serde_json = { workspace = true }
spdx = "0.10"
unicode-normalization = "0.1.25"

[[test]]
name = "skin"
path = "tests/skin.rs"
