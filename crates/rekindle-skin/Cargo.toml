[package]
name = "rekindle-skin"
version = "0.1.0"
edition = "2021"
description = "The skin package format rekindle-skin/1: the strict in-memory zip walk, the manifest rules, the token profile and the closed token registry (plan E7.7.1)"
license = "MIT"
# One test binary: `tests/skin.rs` holds the shared zip writer and both suites.
autotests = false

[lints]
workspace = true

[dependencies]
# The canonical package's content address (step 7).
blake3 = "1"
crc32fast = "1.5"
# PCM16 WAV writer for the re-encoded sound cues (Apache-2.0).
hound = "3.5"
rekindle-image = { path = "../rekindle-image" }
rekindle-types = { path = "../rekindle-types" }
serde = { workspace = true }
serde_json = { workspace = true }
spdx = "0.10"
# Sound decoders: WAV (PCM), Ogg Vorbis and FLAC only, pure Rust (MPL-2.0).
symphonia = { version = "0.5", default-features = false, features = [ "wav", "pcm", "ogg", "vorbis", "flac" ] }
unicode-normalization = "0.1.25"

[[test]]
name = "skin"
path = "tests/skin.rs"

[dev-dependencies]
blake3 = "1"
