[package]
name = "rekindle-crypto"
version = "0.1.0"
edition = "2021"
description = "Ed25519 identity, Signal Protocol sessions, and group encryption for Rekindle"

[lints]
workspace = true

[dependencies]
# Tier 1 owns the primitive crypto error taxonomy; this crate wraps it
# rather than restating it (see src/error.rs).
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = [ "rand_core", "zeroize" ] }
hex = "0.4"
base64 = "0.22"
hkdf = "0.12"
# KDF_CK of the spec Double Ratchet (`signal::dr`): HMAC-SHA256 over the
# chain key, DR rev. 1 §5.2.
hmac = "0.12"
rand = "0.8"
# The prekey record values (`PrekeyRecordHead`, `OpkSlot`) are the codec's
# Cap'n Proto DTOs (plan E2.4).
rekindle-codec = { path = "../rekindle-codec" }
rekindle-secrets = { path = "../rekindle-secrets" }
rekindle-types = { path = "../rekindle-types" }
# `RandomSource` (plan C9.2): the ratchet and PQXDH keys the pure session
# API mints come from the caller's generator.
rekindle-utils = { path = "../rekindle-utils" }
serde = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
x25519-dalek = { version = "2", features = [ "static_secrets" ] }
zeroize = { version = "1", features = [ "derive" ] }
# Identifier hashing under a derive-key context (`prekey_record::base_key_hash`,
# crypto-primitives §7); also the test generator's seed (`signal::test_support`).
blake3 = "1"

[dev-dependencies]
parking_lot = "0.12"
proptest = "1"
