[package]
name = "rekindle-dm"
version = "0.1.0"
edition = "2021"
description = "Group DMs — signed rosters, sender-owned keys, admission of roster members (plan E2.6)"
license = "MIT"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
hex = { workspace = true }
parking_lot = { workspace = true }
rekindle-codec = { path = "../rekindle-codec" }
rekindle-secrets = { path = "../rekindle-secrets" }
rekindle-types = { path = "../rekindle-types" }
rekindle-utils = { path = "../rekindle-utils" }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [ "macros", "rt" ] }
