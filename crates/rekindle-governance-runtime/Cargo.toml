[package]
name = "rekindle-governance-runtime"
version = "0.1.0"
edition = "2021"
description = "Phase 18 — community lifecycle orchestration (origin / bootstrap / join / segments / apply) layered on top of rekindle-governance's pure CRDT merge"
license = "MIT"

[lints]
workspace = true

[dependencies]
rekindle-types = { path = "../rekindle-types" }
# Tier 5 (downward edge). Reuses `parse_and_classify_row` — the W26
# signature verify + ban filter that decides whether a registry row
# represents a real member — so slot reclamation and presence polling
# cannot drift on what "occupied" means.
async-trait = "0.1"
base64 = "0.23"
blake3 = "1"
futures = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rekindle-codec = { path = "../rekindle-codec" }
rekindle-crypto = { path = "../rekindle-crypto" }
rekindle-governance = { path = "../rekindle-governance" }
rekindle-lifecycle = { path = "../rekindle-lifecycle" }
rekindle-presence = { path = "../rekindle-presence" }
rekindle-records = { path = "../rekindle-records" }
rekindle-secrets = { path = "../rekindle-secrets" }
rekindle-utils = { path = "../rekindle-utils" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
mockall = "0.13"
tokio = { workspace = true, features = [ "macros", "rt-multi-thread", "test-util" ] }
