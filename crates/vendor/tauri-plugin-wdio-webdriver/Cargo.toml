[package]
name = "tauri-plugin-wdio-webdriver"
version = "1.5.1"
description = "Embedded WebDriver server for driving the debug app in tests; vendored from tauri-plugin-wdio-webdriver 1.5.1 (MIT) and patched (see README.md)."
license = "MIT"
repository = "https://github.com/webdriverio/desktop-mobile"
edition = "2021"
publish = false
links = "tauri-plugin-wdio-webdriver"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
parking_lot = "0.12"
rekindle-secrets = { path = "../../rekindle-secrets" }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1"
tauri = "2.10.0"
thiserror = "2"
tokio = { version = "1", features = [ "rt-multi-thread", "sync", "net", "time", "macros" ] }
tracing = "0.1"
uuid = { version = "1", features = [ "v4" ] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [ "NSImage", "NSImageRep", "NSBitmapImageRep" ] }
objc2-foundation = { version = "0.3", features = [ "NSString", "NSData", "NSError", "NSArray", "NSDictionary", "NSTimer", "NSRunLoop", "NSDate", "NSURL", "block2" ] }
objc2-web-kit = { version = "0.3", features = [ "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKUIDelegate", "WKPDFConfiguration", "WKFrameInfo", "WKContentWorld", "WKUserContentController", "WKScriptMessage", "WKScriptMessageHandler", "WKSecurityOrigin", "WKOpenPanelParameters", "block2", "objc2-app-kit" ] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = [ "png" ] }
glib = "0.18"
gtk = "0.18"
javascriptcore-rs = "1.1"
tempfile = "3"
# v2_40: `call_async_javascript_function` (exec_script); 2.40 is the WebKitGTK floor (plan E7.10).
webkit2gtk = { version = "2.0", features = [ "v2_40" ] }

[dev-dependencies]
tower = { version = "0.5", features = [ "util" ] }

[build-dependencies]
tauri-plugin = { version = "2.5.3", features = [ "build" ] }
