[package]
name = "rekindle-route"
version = "0.1.0"
publish = false
edition = "2021"
license.workspace = true
description = "Route lifecycle and cache primitives for Rekindle v2.0"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
blake3 = "1"
parking_lot = { workspace = true }
rekindle-lifecycle = { path = "../rekindle-lifecycle" }
rekindle-records = { path = "../rekindle-records" }
rekindle-types = { path = "../rekindle-types" }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = [ "rt" ] }
tracing = { workspace = true }

[dev-dependencies]
# A paused clock for the no-timed-rotation test (plan RV1).
tokio = { workspace = true, features = [ "test-util", "macros" ] }
