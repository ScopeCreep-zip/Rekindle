# cargo-deny configuration for the Rekindle workspace.
#
# Run with:    cargo deny check
# Sub-checks:  cargo deny check advisories
#              cargo deny check bans
#              cargo deny check licenses
#              cargo deny check sources
#
# Spec: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check every target the workspace builds for.
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ─── Advisories ─────────────────────────────────────────────────────────
#
# RustSec advisory database. Any `vulnerability` is denied; `unmaintained`
# / `unsound` / `notice` are warnings the maintainer must triage. Yanked
# crates always fail.
#
# When a transient false-positive blocks CI, add the advisory ID to
# `ignore` with a `// reason` line. Do not blanket-ignore.

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = [ "https://github.com/rustsec/advisory-db" ]
yanked = "deny"
# Each ignore below records its reachability analysis (plan SC1, 2026-11-20)
# and is reviewed at the next quarterly audit (docs/contributor/
# dependency-audit.md), review by 2027-02-20, or as soon as a compatible
# patched release exists, whichever comes first.
ignore = [
    # capnp 0.20.6 (rekindle-codec, direct). Affected: the safe
    # `capnp::constant::Reader::get` and `capnp::schema::StructSchema::new`
    # build readers from caller-supplied words without validation. Not
    # reachable with untrusted data: our schemas (schemas/*.capnp) declare
    # no pointer constants, so no `constant::Reader` exists, and
    # `StructSchema::new` is called only by capnpc-generated code with the
    # generator's own static `RAW_SCHEMA` (governance_op's dynamic_struct
    # clear of `sig` included); received bytes go through the validating
    # message readers, never through either function. Fixed in 0.24
    # (semver-incompatible codegen); the 0.20 -> 0.24+ bump is its own step.
    { id = "RUSTSEC-2025-0143", reason = "capnp: unsound constructors reached only with capnpc-generated static schemas; no pointer consts in our schemas; fix needs 0.24 codegen bump (review by 2027-02-20)" },
    # glib 0.18.5 (Linux only, via gtk/webkit2gtk 0.18 <- tauri/wry/tao).
    # Affected: `glib::VariantStrIter` (Variant::array_iter_str). Not
    # reachable: no crate in our tree calls it (grep of gtk 0.18.2, gio
    # 0.18.4, gdk 0.18.2, webkit2gtk 2.0.2 sources: only glib itself
    # defines it); our only glib use is `Cast` in src-tauri/src/platform.rs.
    # Fixed in glib 0.20, which tauri's GTK 3 stack cannot take.
    { id = "RUSTSEC-2024-0429", reason = "glib: VariantStrIter is never called in our tree; gtk-rs 0.18 is pinned by tauri/wry's GTK 3 stack (review by 2027-02-20)" },
    # libsqlite3-sys 0.37.0 (bundled SQLCipher; via rusqlite 0.39, ours and
    # veilid-core 0.5.8's keyvaluedb-sqlite -> async-sqlite, ADR 0017).
    # SQLite < 3.54.0 can return uninitialized page-cache memory when it
    # opens a database with a sibling -wal of a different page size. We use
    # WAL (rekindle-db/src/open.rs), but exploiting it needs write access to
    # the owner-only data root, i.e. code running as the user, which the
    # threat model's section 1 puts out of scope (the OS is the trust root).
    # No fixed build exists for us: libsqlite3-sys 0.39's bundled-sqlcipher
    # still bundles SQLite 3.53.4 (sqlcipher-src 419.0.6), and veilid-core's
    # pinned tree requires rusqlite 0.39 -> libsqlite3-sys 0.37.
    { id = "RUSTSEC-2026-0459", reason = "SQLite page-cache disclosure needs a crafted db+wal pair in the owner-only data root (local same-user attacker, out of scope); no patched SQLCipher bundle exists and veilid-core pins rusqlite 0.39 (review by 2027-02-20)" },
]

# ─── Licenses ───────────────────────────────────────────────────────────
#
# Rekindle is MIT. The allowlist below covers MIT-compatible permissive
# licenses we accept in the dependency graph. Copyleft (GPL family),
# OSL, RPSL, MS-RL, MS-PL, etc. are not on the allowlist; cargo-deny
# will fail the check if they appear.
#
# Reviewed additions (plan E7.7.3, build-time importers only; neither is
# linked into an app binary):
#   pelite 0.10.0 (MIT; with dataview 1.1.0, pelite-macros 0.1.1 and
#     no-std-compat 0.4.1, all MIT): xtask `import-xfire-data` reads
#     `icons.dll` as PE resource data from its bytes, never loaded; built
#     with `std` only, without the `mmap` (libc/winapi) feature.
#   quick-xml 0.38 (MIT): rekindle-skin's legacy XML importers and the
#     xtask's Xfire `sounds.xml` reader; no DTD or entity resolution (an
#     entity reference refuses the file).
#
# Reviewed addition (plan E7.7.1 "Helper process", d4 §2.2; macOS only):
#   libproc 0.14.11 (MIT; with errno 0.3 and libc, already in the tree;
#     build-time bindgen 0.72, already in the tree): the Host's footprint
#     watchdog reads the skin helper's `ri_phys_footprint` through the safe
#     `pidrusage`, the `unsafe` FFI staying inside the crate.

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "Unlicense",
]
exceptions = [
    # Per-crate license overrides go here when a crate is dual-licensed
    # but cargo-deny cannot detect the SPDX correctly. Keep this list
    # short; prefer asking upstream to fix their `license` field.
]

[[licenses.clarify]]
# `ring` ships with a non-standard license expression that cargo-deny
# cannot parse without a hint.
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [ { path = "LICENSE", hash = 0xbd0eed23 } ]

# ─── Bans ───────────────────────────────────────────────────────────────
#
# Disallow specific crates we don't want anywhere in the dep graph. Also
# warn on duplicate versions of the same crate (a common cause of
# binary bloat and subtle correctness bugs in the cryptography stack).

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # OpenSSL bindings are forbidden — we use Rustls / RustCrypto / ring.
    # Tauri pulls in `openssl` indirectly on some platforms; if the
    # check fires for that reason, file an upstream issue rather than
    # whitelisting here.
    { name = "openssl-sys", reason = "Use Rustls / RustCrypto / ring instead." },

    # Old-style ed25519 / x25519 wrappers — only the dalek implementations are vetted.
    { name = "ed25519", reason = "Use ed25519-dalek directly." },

    # ─── Tier-2 sole crypto boundary (PENDING enforcement) ──────────────
    #
    # The architectural rule is: only `rekindle-secrets` may import the
    # following crypto crates directly. Every other crate must consume
    # them through `rekindle-secrets`'s public API.
    #
    # Today, six crates still import these directly (rekindle-crypto,
    # rekindle-dm, rekindle-calls, rekindle-voice, rekindle-node,
    # rekindle-protocol, etc.) — see `cargo xtask check-boundaries` for
    # the full list. The `wrappers = ["rekindle-secrets"]` clause
    # below would fail the build for those crates, so it is COMMENTED
    # OUT until the cleanup sweep documented in
    # docs/contributor/ai-assisted-contributions.md §5 lands.
    #
    # The xtask boundary check enforces a softer version of the same
    # rule today (warn-style listing) so contributors see the goal.
    #
    # { name = "ed25519-dalek",     wrappers = ["rekindle-secrets"], reason = "Tier 2 sole crypto boundary." },
    # { name = "x25519-dalek",      wrappers = ["rekindle-secrets"], reason = "Tier 2 sole crypto boundary." },
    # { name = "aes-gcm",           wrappers = ["rekindle-secrets"], reason = "Tier 2 sole crypto boundary." },
    # { name = "chacha20poly1305",  wrappers = ["rekindle-secrets"], reason = "Tier 2 sole crypto boundary." },
    # { name = "hkdf",              wrappers = ["rekindle-secrets"], reason = "Tier 2 sole crypto boundary." },
    #
    # ─── Veilid boundary (ADR 0014, PENDING enforcement here) ──────────
    #
    # The boundary is transitive: only `rekindle-protocol`,
    # `rekindle-transport`, `rekindle-node` and, until F1,
    # `rekindle-desktop` may link veilid-core (ADR 0021 keeps the record
    # pool's logic Veilid-free). `cargo xtask check` enforces it today;
    # this entry would let cargo-deny enforce the direct-dependency half.
    #
    # { name = "veilid-core",       wrappers = ["rekindle-protocol", "rekindle-transport", "rekindle-node", "rekindle-desktop"], reason = "ADR 0014: the Veilid boundary is transitive." },
]
skip = [
    # Tolerated duplicates. Each entry must be revisited when the
    # upstream is updated. Keep the list short.
]
skip-tree = [
    # `windows-sys` is famously many-versioned across the dep graph.
    # Skip the whole tree to keep the duplicate-version warning useful
    # on crates we actually own.
    { name = "windows-sys" },
    { name = "windows" },
]

# ─── Sources ────────────────────────────────────────────────────────────
#
# Crates may only come from crates.io plus the explicitly-allowed git
# remotes already pinned in the workspace `Cargo.toml`. Anything else is
# a supply-chain red flag — cargo-deny will fail the check.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [ "https://github.com/rust-lang/crates.io-index" ]
allow-git = [
    # Pinned git deps already in Cargo.toml. Keep this list in sync
    # with `[patch.crates-io]` and any `git = "..."` entries.
    "https://github.com/mcginty/snow",
    # veilid-core 0.5.8 + the route select/release drain fix (branch
    # rekindle/v0.5.8-route-drain, rev 91453e97), until a Veilid release
    # carries it (ADR 0017, root Cargo.toml [patch.crates-io]).
    "https://github.com/radicalkjax/veilid.git",
    # libdbus-sys at dbus-rs commit dd78d826 (HAVE_POLL in the vendored
    # build, upstream PR #523) until a release carries it (plan E7.13 W7,
    # root Cargo.toml [patch.crates-io]).
    "https://github.com/diwic/dbus-rs",
]

[sources.allow-org]
# No org-level allowlists. Per-repo allowance is more auditable.
github = [  ]
gitlab = [  ]
bitbucket = [  ]
