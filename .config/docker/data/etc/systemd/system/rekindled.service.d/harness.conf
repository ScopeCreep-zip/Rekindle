# The Docker harness runs the shipped unit
# (crates/rekindle-node/contrib/systemd/rekindled.service) as a system
# service for user `rekindle`. These are its only differences (plan V.4).

[Unit]
# The OS keyring the daemon uses until plan D1 replaces it with the vault.
After=gnome-keyring.service dbus-user-session.service
Requires=gnome-keyring.service dbus-user-session.service
Before=rekindle-init.service

[Service]
User=rekindle
Group=rekindle
# The binary is bind-mounted by the compose files.
ExecStart=
ExecStart=/usr/local/bin/rekindled
Environment=HOME=/home/rekindle
Environment=RUST_LOG=rekindle=debug,rekindle_transport=debug,rekindle_node=debug,veilid_core=warn
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
Environment=XDG_RUNTIME_DIR=/run/user/1000
# In system scope RuntimeDirectory= is /run/rekindle, not the user runtime
# dir that holds the socket, and ProtectSystem=strict makes /run read-only.
ReadWritePaths=/run/user/1000
