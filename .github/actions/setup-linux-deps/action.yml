# Composite action: the one list of Ubuntu system packages the Rust
# workspace links against. ci.yml (clippy/test, the Tauri build) and
# lint.yml (the xtask release-build check) compile the whole workspace,
# so they share this list; it mirrors flake.nix's Linux `rekindlePackages`
# and scripts/setup-linux.sh's debian list.
name: Setup Linux system deps
description: apt-get install the system libraries the Rekindle workspace builds against on Ubuntu 24.04.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        # Tauri / WebKitGTK shell: libwebkit2gtk-4.1-dev, libgtk-3-dev,
        #   libayatana-appindicator3-dev, librsvg2-dev, libsoup-3.0-dev, libxdo-dev
        # rekindle-protocol build.rs codegen: capnproto
        # opus (cmake build), cpal ALSA + PipeWire hosts (bindgen -> libclang):
        #   cmake, libopus-dev, libasound2-dev, libpipewire-0.3-dev, libspa-0.2-dev, libclang-dev
        # rekindle-video-capture (gstreamer, gstreamer-app, gstreamer-video):
        #   libgstreamer1.0-dev, libgstreamer-plugins-base1.0-dev
        # libdbus-sys (D-Bus): libdbus-1-dev
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config cmake capnproto libssl-dev \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev libsoup-3.0-dev libxdo-dev \
          libopus-dev libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libdbus-1-dev
