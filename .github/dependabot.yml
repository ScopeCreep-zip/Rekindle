# Dependabot configuration — three ecosystems, weekly cadence.
# Spec: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ── Cargo (Rust) ──────────────────────────────────────────────────
  # The workspace root holds the full dependency graph; per-crate
  # Cargo.toml files inherit from `[workspace.dependencies]`. Single
  # entry covers the whole workspace.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    # Supply-chain cooldown (Semgrep dependabot-missing-cooldown): a
    # version update waits until the release is 14 days old; security
    # updates are exempt from cooldown and still open at once.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(rust)"
      include: "scope"
    groups:
      # Group security updates so a CVE patch lands as one PR.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Group minor + patch routine bumps to reduce PR noise.
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      # Majors go in one weekly PR per ecosystem, never one PR each. A
      # major is grouped, not ignored: an `ignore` rule also applies to
      # security updates (docs: "ignore those dependencies when it opens
      # pull requests for version updates and security updates").
      cargo-major:
        applies-to: version-updates
        update-types: ["major"]

  # ── npm / pnpm (frontend) ─────────────────────────────────────────
  # Dependabot reads pnpm-lock.yaml as of the v2 schema. Workspace
  # packages defined in package.json at the root.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    # Supply-chain cooldown (Semgrep dependabot-missing-cooldown): a
    # version update waits until the release is 14 days old; security
    # updates are exempt from cooldown and still open at once.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(js)"
      include: "scope"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      # Majors go in one weekly PR per ecosystem, never one PR each. A
      # major is grouped, not ignored: an `ignore` rule also applies to
      # security updates (docs: "ignore those dependencies when it opens
      # pull requests for version updates and security updates").
      npm-major:
        applies-to: version-updates
        update-types: ["major"]

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # Supply-chain cooldown (Semgrep dependabot-missing-cooldown): a
    # version update waits until the release is 14 days old; security
    # updates are exempt from cooldown and still open at once.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      actions-major:
        applies-to: version-updates
        update-types: ["major"]

  # The SQL lint job's sqlfluff, hash-pinned in .github/requirements/sqlfluff.txt
  # (supply-chain policy item 1).
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # Supply-chain cooldown, as for the other ecosystems.
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      pip-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      pip-major:
        applies-to: version-updates
        update-types: ["major"]
