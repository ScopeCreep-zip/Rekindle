# CodeQL static analysis for JavaScript and TypeScript.
#
# Rust support in CodeQL is still beta and produces meaningful noise on
# Rust idioms; we cover Rust via clippy + cargo-audit + cargo-deny in
# audit.yml. This workflow focuses on the SolidJS frontend and any
# stray JavaScript build tooling.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/**"]
  schedule:
    # Weekly — Sunday 03:30 UTC.
    - cron: "30 3 * * 0"
  workflow_dispatch:

# A newer push to the same pull request supersedes this run: cancel the old one so it
# stops holding a runner the merge queue needs (same rule as ci.yml and lint.yml; pushes
# to the trunk, schedules and manual runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: ${{ matrix.language }}
          # Use the security-extended query suite for higher coverage.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3

      - name: Analyze
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          category: "/language:${{ matrix.language }}"
