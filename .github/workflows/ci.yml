# Main CI — runs on every push to main and every PR.
#
# Two jobs:
#   * fmt + clippy + test — Rust workspace
#   * cross-platform build smoke test — Tauri build per OS
# The real-app UI suite (`pnpm test:app`) is not run here; see the note
# above the build job.
#
# The release pipeline lives in release.yml and is triggered by tags.

# Our own composite actions (.github/actions/<name>) are referenced as
# ScopeCreep-zip/Rekindle/.github/actions/<name>@<full 40-char sha>, never
# ./.github/actions/<name> (zizmor self-repository: a workspace path is not
# pinned and loads whatever the checkout holds). The sha is the latest
# commit that touches that action: after changing .github/actions/<name>,
# push that commit, then set every reference to
#   git log -1 --format=%H -- .github/actions/<name>
# in a follow-up commit (the pinned commit must already be on GitHub).

name: CI

on:
  # A pull request runs once, on pull_request. push covers only the long-lived
  # branches a merge lands on (main and the integration branch); a push to a PR
  # branch would otherwise start a second, identical run (GitHub: "If multiple
  # triggering events for your workflow occur at the same time, multiple workflow
  # runs will be triggered").
  push:
    branches: [main, codex/communities-merge-cli-claude-remote]
  pull_request:
    branches: [main, "codex/**"]
  # The merge queue tests each entry on top of the entries ahead of it (GitHub merge queue).
  merge_group:
  workflow_dispatch:

# A new commit on a pull request cancels that PR's older run; pushes to main and
# the integration branch never cancel, so every merged commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────────
  # Rust: fmt + clippy + test on Ubuntu (the cheap path).
  # ────────────────────────────────────────────────────────────────
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install system deps
        uses: ScopeCreep-zip/Rekindle/.github/actions/setup-linux-deps@7cf987f7e8b2f5b396fa467a3831db5c1055535b # action content as of 7cf987f7e

      - name: Install Rust toolchain
        # rust-toolchain.toml pins the version; this just makes sure
        # the components are present.
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "ci-rust"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (desktop, webdriver-test)
        run: cargo clippy -p rekindle-desktop --all-targets --features webdriver-test -- -D warnings
      - name: WebDriver server absent from release builds
        run: cargo xtask check-webdriver-release
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  # ────────────────────────────────────────────────────────────────
  # No UI test job. The UI is tested only in the real desktop app
  # (`pnpm test:app`, e2e/app/: WebdriverIO through the app's embedded,
  # token-guarded WebDriver server), which needs a desktop session (a
  # window server and a webview). The gate runs it on both target
  # machines (macOS and Linux); see docs/contributor/testing.md.
  # Frontend lint and typecheck run in lint.yml.
  # ────────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────────
  # Cross-platform build smoke test. Verifies Tauri builds clean on
  # all three target OSes; doesn't run the GUI.
  # ────────────────────────────────────────────────────────────────
  tauri-build:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: ScopeCreep-zip/Rekindle/.github/actions/setup-linux-deps@7cf987f7e8b2f5b396fa467a3831db5c1055535b # action content as of 7cf987f7e

      # rekindle-protocol's build.rs shells out to `capnp` for schema
      # codegen on every build — not just Linux. Matches release.yml's
      # per-OS install.
      - name: Install system deps (macOS)
        if: matrix.os == 'macos-15'
        run: brew install capnp

      - name: Install system deps (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: ./scripts/ci/install-capnp-windows.ps1

      # rekindle-video-capture links GStreamer on every OS (gstreamer-sys
      # finds it through pkg-config). Install the official 1.26.8 runtime +
      # development packages, each checked against the sha256 that
      # gstreamer.freedesktop.org publishes beside it. On macOS they land
      # in /Library/Frameworks/GStreamer.framework, the path
      # .cargo/config.toml already points PKG_CONFIG_PATH at.
      - name: Install GStreamer (macOS)
        if: matrix.os == 'macos-15'
        env:
          GST_VERSION: "1.26.8"
        run: |
          base="https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}"
          while read -r sum pkg; do
            curl -sSfL "${base}/${pkg}" -o "${RUNNER_TEMP}/${pkg}"
            echo "${sum}  ${RUNNER_TEMP}/${pkg}" | shasum -a 256 -c -
            sudo installer -pkg "${RUNNER_TEMP}/${pkg}" -target /
          done <<SUMS
          cbf02848ea1cfd742e34089da5d5ab693869de55b4a6e6ced57b2270bc40f0e7 gstreamer-1.0-${GST_VERSION}-universal.pkg
          ef5bb48607d10be6a9a7e1f6632bc690369185d8b920f4883a64a9806d8fb6e4 gstreamer-1.0-devel-${GST_VERSION}-universal.pkg
          SUMS

      # Windows: the MSVC runtime + devel MSIs; the devel tree ships the
      # .pc files and pkg-config.exe, so PKG_CONFIG_PATH and PATH point there
      # (setting PKG_CONFIG_PATH in the environment wins over the macOS
      # default in .cargo/config.toml, which is set-if-unset).
      - name: Install GStreamer (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        env:
          GST_VERSION: "1.26.8"
        run: ./scripts/ci/install-gstreamer-windows.ps1

      - uses: ScopeCreep-zip/Rekindle/.github/actions/setup-pnpm@7cf987f7e8b2f5b396fa467a3831db5c1055535b # action content as of 7cf987f7e

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "ci-tauri-${{ matrix.os }}"

      - name: cargo check (workspace, default features)
        run: cargo check --workspace
