# Rust and Tauri validation for trunk pull requests and merge groups.
#
# The release pipeline lives in release.yml and is triggered by tags.

# Our own composite actions (.github/actions/<name>) are referenced as
# ScopeCreep-zip/Rekindle/.github/actions/<name>@<full 40-char sha>, never
# ./.github/actions/<name> (zizmor self-repository: a workspace path is not
# pinned and loads whatever the checkout holds). The sha is the latest
# commit that touches that action: after changing .github/actions/<name>,
# push that commit, then set every reference to
#   git log -1 --format=%H -- .github/actions/<name>
# in a follow-up commit (the pinned commit must already be on GitHub).

name: CI

on:
  pull_request:
    branches: [codex/communities-merge-cli-claude-remote]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    branches: [codex/communities-merge-cli-claude-remote]
    types: [checks_requested]

concurrency:
  # Supersede work on the same PR. Queue runs are keyed by the full group ref.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('mq-{0}', github.event.merge_group.head_ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  classify:
    name: CI plan
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/classify-ci.sh

  fmt:
    name: Rust formatting
    needs: classify
    if: startsWith(needs.classify.outputs.plan, 'full-')
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Rust Clippy
    needs: classify
    if: startsWith(needs.classify.outputs.plan, 'full-')
    runs-on: ubuntu-24.04
    steps:
      - *checkout

      - &linux-deps
        name: Install system deps
        uses: ScopeCreep-zip/Rekindle/.github/actions/setup-linux-deps@7cf987f7e8b2f5b396fa467a3831db5c1055535b # action content as of 7cf987f7e

      - &rust-toolchain
        name: Install Rust toolchain
        # rust-toolchain.toml pins the version; this just makes sure
        # the components are present.
        run: |
          rustup show
          rustup component add rustfmt clippy

      - &rust-cache
        name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: "ci-rust"
          save-if: false

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (desktop, webdriver-test)
        run: cargo clippy -p rekindle-desktop --all-targets --features webdriver-test -- -D warnings

  test:
    name: Rust workspace tests
    needs: classify
    if: needs.classify.outputs.plan == 'full-queue'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *linux-deps
      - *rust-toolchain
      - *rust-cache

      - name: cargo test (including netsim)
        run: cargo test --workspace --no-fail-fast

  # ────────────────────────────────────────────────────────────────
  # No UI test job. The UI is tested only in the real desktop app
  # (`pnpm test:app`, e2e/app/: WebdriverIO through the app's embedded,
  # token-guarded WebDriver server), which needs a desktop session (a
  # window server and a webview). The gate runs it on both target
  # machines (macOS and Linux); see docs/contributor/testing.md.
  # Frontend lint and typecheck run in lint.yml.
  # ────────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────────
  # Cross-platform build smoke test. Verifies Tauri builds clean on
  # all three target OSes; doesn't run the GUI.
  # ────────────────────────────────────────────────────────────────
  # Keep three concrete check names even when the plan skips every build.
  tauri-linux:
    name: Tauri build (ubuntu-24.04)
    needs: classify
    if: needs.classify.outputs.plan == 'full-queue'
    runs-on: ubuntu-24.04
    env:
      TAURI_CACHE_KEY: ci-tauri-ubuntu-24.04
    steps: &tauri-steps
      - *checkout

      - name: Install Rust toolchain
        run: rustup show

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        uses: ScopeCreep-zip/Rekindle/.github/actions/setup-linux-deps@7cf987f7e8b2f5b396fa467a3831db5c1055535b # action content as of 7cf987f7e

      # rekindle-protocol's build.rs shells out to `capnp` for schema
      # codegen on every build — not just Linux. Matches release.yml's
      # per-OS install.
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install capnp

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-capnp-windows.ps1

      # rekindle-video-capture links GStreamer on every OS (gstreamer-sys
      # finds it through pkg-config). Install the official 1.26.8 runtime +
      # development packages, each checked against the sha256 that
      # gstreamer.freedesktop.org publishes beside it. On macOS they land
      # in /Library/Frameworks/GStreamer.framework, the path
      # .cargo/config.toml already points PKG_CONFIG_PATH at.
      - name: Install GStreamer (macOS)
        if: runner.os == 'macOS'
        env:
          GST_VERSION: "1.26.8"
        run: |
          base="https://gstreamer.freedesktop.org/data/pkg/osx/${GST_VERSION}"
          while read -r sum pkg; do
            curl -sSfL "${base}/${pkg}" -o "${RUNNER_TEMP}/${pkg}"
            echo "${sum}  ${RUNNER_TEMP}/${pkg}" | shasum -a 256 -c -
            sudo installer -pkg "${RUNNER_TEMP}/${pkg}" -target /
          done <<SUMS
          cbf02848ea1cfd742e34089da5d5ab693869de55b4a6e6ced57b2270bc40f0e7 gstreamer-1.0-${GST_VERSION}-universal.pkg
          ef5bb48607d10be6a9a7e1f6632bc690369185d8b920f4883a64a9806d8fb6e4 gstreamer-1.0-devel-${GST_VERSION}-universal.pkg
          SUMS

      # Windows: the MSVC runtime + devel MSIs; the devel tree ships the
      # .pc files and pkg-config.exe, so PKG_CONFIG_PATH and PATH point there
      # (setting PKG_CONFIG_PATH in the environment wins over the macOS
      # default in .cargo/config.toml, which is set-if-unset).
      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GST_VERSION: "1.26.8"
        run: ./scripts/ci/install-gstreamer-windows.ps1

      - uses: ScopeCreep-zip/Rekindle/.github/actions/setup-pnpm@7cf987f7e8b2f5b396fa467a3831db5c1055535b # action content as of 7cf987f7e

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ env.TAURI_CACHE_KEY }}
          save-if: false

      - name: cargo check (workspace, default features)
        run: cargo check --workspace

  tauri-macos:
    name: Tauri build (macos-15)
    needs: classify
    if: needs.classify.outputs.plan == 'full-queue'
    runs-on: macos-15
    env:
      TAURI_CACHE_KEY: ci-tauri-macos-15
    steps: *tauri-steps

  tauri-windows:
    name: Tauri build (windows-2022)
    needs: classify
    if: needs.classify.outputs.plan == 'full-queue'
    runs-on: windows-2022
    env:
      TAURI_CACHE_KEY: ci-tauri-windows-2022
    steps: *tauri-steps

  # This stable name still gates the split Rust jobs under the existing ruleset.
  rust:
    name: Rust (fmt / clippy / test)
    if: ${{ always() && (startsWith(needs.classify.outputs.plan, 'full-') || (needs.classify.result != 'success' && github.event.pull_request.draft != true)) }}
    needs: [classify, fmt, clippy, test]
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      RESULTS: ${{ toJSON(needs) }}
      PLAN: ${{ needs.classify.outputs.plan }}
      EXPECTED: classify fmt clippy ${{ needs.classify.outputs.plan == 'full-queue' && 'test' || '' }}
    steps:
      - &check-results
        name: Check planned results
        if: ${{ always() }}
        run: |
          case "$PLAN" in
            draft|license|docs|full-pr|full-queue) ;;
            *) echo '::error::Missing or invalid CI plan'; exit 1 ;;
          esac

          problems=$(jq -r --arg expected "$EXPECTED" '
            ($expected | split(" ") | map(select(length > 0))) as $planned
            | . as $results
            | (($planned + keys) | unique)[]
            | . as $job
            | (if $planned | index($job) then "success" else "skipped" end) as $want
            | ($results[$job].result // "missing") as $got
            | select($want != $got)
            | "\($job): expected \($want), got \($got)"
          ' <<< "$RESULTS")
          if [[ -n $problems ]]; then
            printf '::error::%s\n' "$problems"
            exit 1
          fi

      - &reject-cancelled
        name: Reject cancelled runs
        if: cancelled()
        run: |
          echo '::error::Workflow run was cancelled'
          exit 1

  required:
    name: CI Required
    if: ${{ always() }}
    needs: [classify, fmt, clippy, test, tauri-linux, tauri-macos, tauri-windows, rust]
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      RESULTS: ${{ toJSON(needs) }}
      PLAN: ${{ needs.classify.outputs.plan }}
      EXPECTED: >-
        classify
        ${{ startsWith(needs.classify.outputs.plan, 'full-') && 'fmt clippy rust' || '' }}
        ${{ needs.classify.outputs.plan == 'full-queue' && 'test tauri-linux tauri-macos tauri-windows' || '' }}
    steps:
      - *check-results
      - *reject-cancelled
      - name: Require a ready pull request
        if: needs.classify.outputs.plan == 'draft'
        run: |
          echo '::error::Draft pull request: mark ready to validate'
          exit 1
