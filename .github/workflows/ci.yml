# Main CI — runs on every push to main and every PR.
#
# Two jobs:
#   * fmt + clippy + test — Rust workspace
#   * cross-platform build smoke test — Tauri build per OS
# The real-app UI suite (`pnpm test:app`) is not run here; see the note
# above the build job.
#
# The release pipeline lives in release.yml and is triggered by tags.

name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main, "codex/**"]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────────
  # Rust: fmt + clippy + test on Ubuntu (the cheap path).
  # ────────────────────────────────────────────────────────────────
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev pkg-config \
            build-essential capnproto

      - name: Install Rust toolchain
        # rust-toolchain.toml pins the version; this just makes sure
        # the components are present.
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rust"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  # ────────────────────────────────────────────────────────────────
  # No UI test job. The UI is tested only in the real desktop app
  # (`pnpm test:app`, e2e/app/: WebdriverIO through the app's embedded,
  # token-guarded WebDriver server), which needs a desktop session (a
  # window server and a webview). The gate runs it on both target
  # machines (macOS and Linux); see docs/contributor/testing.md.
  # Frontend lint and typecheck run in lint.yml.
  # ────────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────────
  # Cross-platform build smoke test. Verifies Tauri builds clean on
  # all three target OSes; doesn't run the GUI.
  # ────────────────────────────────────────────────────────────────
  tauri-build:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev pkg-config capnproto

      # rekindle-protocol's build.rs shells out to `capnp` for schema
      # codegen on every build — not just Linux. Matches release.yml's
      # per-OS install.
      - name: Install system deps (macOS)
        if: matrix.os == 'macos-14'
        run: brew install capnp

      - name: Install system deps (Windows)
        if: matrix.os == 'windows-2022'
        run: choco install capnproto

      - uses: ./.github/actions/setup-pnpm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-tauri-${{ matrix.os }}"

      - name: cargo check (workspace, default features)
        run: cargo check --workspace
