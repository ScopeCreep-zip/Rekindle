# Dependency review — blocks PRs that introduce vulnerable, yanked, or
# license-incompatible dependencies.
#
# Uses GitHub's official `dependency-review-action`, which inspects the
# diff between the PR's base and head and reports any new dependency
# meeting the failure criteria. Complements the daily `cargo audit`
# scheduled run by providing per-PR feedback before merge.

name: Dependency Review

on:
  pull_request:
    branches: [main, "codex/**"]

# A newer push to the same pull request supersedes this run: cancel the old one so it
# stops holding a runner the merge queue needs (same rule as ci.yml and lint.yml; pushes
# to the trunk, schedules and manual runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          # Mirror the allow-list from deny.toml so this check stays in
          # sync with the cargo-deny policy.
          allow-licenses: >-
            MIT,
            MIT-0,
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Zlib,
            0BSD,
            Unicode-DFS-2016,
            Unicode-3.0,
            CC0-1.0,
            CDLA-Permissive-2.0,
            MPL-2.0,
            OpenSSL,
            BSL-1.0,
            Unlicense
          comment-summary-in-pr: on-failure
