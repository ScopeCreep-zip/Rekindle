# Supply-chain audit — cargo-deny (RustSec advisory DB, bans, licenses,
# sources) + pnpm audit.
#
# Runs on every PR, every push to main, and on a daily schedule so a
# newly-disclosed CVE in a transitive dep is caught even when the
# repo is otherwise quiet.
#
# One advisory policy: deny.toml [advisories]. cargo-deny's advisories check
# reads the RustSec advisory-db ("used to detect issues for crates by looking
# in an advisory database", cargo-deny book, checks/advisories); a separate
# cargo-audit job kept a second, drifting ignore list and is gone (plan §3.0).
# See docs/security/supply-chain-policy.md.

# Our own composite actions (.github/actions/<name>) are referenced as
# ScopeCreep-zip/Rekindle/.github/actions/<name>@<full 40-char sha>, never
# ./.github/actions/<name> (zizmor self-repository: a workspace path is not
# pinned and loads whatever the checkout holds). The sha is the latest
# commit that touches that action: after changing .github/actions/<name>,
# push that commit, then set every reference to
#   git log -1 --format=%H -- .github/actions/<name>
# in a follow-up commit (the pinned commit must already be on GitHub).

name: Audit

on:
  push:
    branches: [codex/communities-merge-cli-claude-remote]
  pull_request:
    branches: ["codex/**"]
  schedule:
    # 04:13 UTC daily — staggered off the hour to spread runner load.
    - cron: "13 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories / bans / licenses / sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          # All four sub-checks. The deny.toml config drives behaviour.
          arguments: --workspace --all-features

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ScopeCreep-zip/Rekindle/.github/actions/setup-pnpm@7cf987f7e8b2f5b396fa467a3831db5c1055535b # action content as of 7cf987f7e

      - name: Audit production deps
        run: pnpm audit --prod --audit-level high
