# Cross-language linting and security CI.
#
# This workflow runs every linter that has a config file in the repo
# root. The Rust toolchain (cargo fmt, cargo clippy) lives in
# ci.yml; this file covers everything else, plus security audits of
# the GitHub Actions workflows themselves.
#
# Configs referenced (each lint job reads its own dotfile):
#   biome.json, .stylelintrc.json, knip.config.ts (frontend)
#   taplo.toml, .markdownlint-cli2.yaml (structured data + docs)
#   .sqlfluff (the SQLite schema)
#   typos.toml (typos)
#   lychee.toml (link checker)
#   .gitleaks.toml (secret scan)
#   .actionlint.yaml, .zizmor.yml (workflow audits)

name: Lint

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main, "codex/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Frontend — Biome + Stylelint + knip.
  # ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (biome / stylelint / knip)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-pnpm

      # The package.json devDependencies for biome / stylelint / knip
      # are pending; once they land the next steps just work. Until
      # then this job is skipped at install time. See
      # docs/contributor/linting.md "Pending devDependencies".
      - name: Biome — check
        if: ${{ hashFiles('node_modules/.bin/biome') != '' }}
        run: pnpm exec biome check src/

      - name: Stylelint — CSS lint
        if: ${{ hashFiles('node_modules/.bin/stylelint') != '' }}
        run: pnpm exec stylelint 'src/styles/**/*.css'

      - name: knip — unused exports / files
        if: ${{ hashFiles('node_modules/.bin/knip') != '' }}
        run: pnpm exec knip

      # Covers src/**, e2e/** and the node-side config files. e2e/ sat
      # outside every tsconfig until tsconfig.e2e.json existed, which is
      # how a call-signature bug in a since-removed e2e spec survived.
      - name: TypeScript — typecheck (src + e2e + configs)
        run: pnpm typecheck

  # ──────────────────────────────────────────────────────────────────
  # Frontend tier boundaries — .dependency-cruiser.cjs encodes the
  # import rules in docs/contributor/architecture-rules.md §2. Its
  # header claimed this job existed long before the job did; the job now
  # exists AND runs, which took three fixes: the devDependency, dropping
  # the `hashFiles` guard, and rewriting three regexes that
  # dependency-cruiser 18 rejects as ReDoS-unsafe (it bails out of the
  # entire run on the first one, so the gate would have stayed inert).
  # ──────────────────────────────────────────────────────────────────
  frontend-arch:
    name: Frontend tiers (dependency-cruiser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-pnpm

      # No `if:` guard. `dependency-cruiser` is a real devDependency now,
      # so this step runs unconditionally. It previously skipped on a
      # `hashFiles('node_modules/.bin/depcruise')` check that could never
      # be true, which meant the job reported success while checking
      # nothing.
      #
      # `--ignore-known` fails on NEW violations only, and the baseline
      # is now EMPTY — down from 92. Nothing is excused and no rule's
      # severity was lowered to get there. Keep it empty: if a change
      # needs a new entry, fix the dependency instead. Regenerate only
      # when deliberately accepting a violation:
      #   pnpm exec depcruise --config .dependency-cruiser.cjs \
      #     --output-type baseline src > .dependency-cruiser-known-violations.json
      - name: dependency-cruiser — tier boundaries
        run: >-
          pnpm exec depcruise --config .dependency-cruiser.cjs
          --ignore-known .dependency-cruiser-known-violations.json src

  # No browser security suite: the CSP, isolation and XSS checks run in
  # the real app (plan E7.14 S6, `pnpm test:app`), which needs a desktop
  # session and so is run by the gate on both target machines, not here.
  # The declared CSP is also covered by src-tauri/tests/csp_policy.rs in
  # ci.yml's Rust job.

  # ──────────────────────────────────────────────────────────────────
  # xtask guardrails — tier boundaries, the unconditional 600-line
  # file-size ceiling (the burn-down allowlist is gone; any file over the
  # limit fails), allow-reason hygiene. Its release-build check compiles
  # the whole workspace, so it needs the same system libraries as ci.yml,
  # and its supply-chain check runs `cargo deny`.
  # ──────────────────────────────────────────────────────────────────
  # Seven gates, all languages: crate boundaries, the 600-line ceiling
  # (rs/ts/tsx/css), `#[allow]` reasons, and four duplication checks —
  # Rust constants, Rust function bodies (cross-crate AND intra-crate),
  # Rust type names across crates, and frontend TS bodies + CSS rules.
  #
  # The duplication gates share one baseline, `xtask/known-duplication.txt`,
  # on the same terms as the dependency-cruiser one: a burn-down, not an
  # excuse. Every line in it is a real duplicate, no gate's severity was
  # lowered to create it, and anything NOT listed fails the build.
  xtask:
    name: Guardrails (cargo xtask check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install system deps
        uses: ./.github/actions/setup-linux-deps

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: xtask

      # `cargo xtask check` runs `cargo deny check advisories bans licenses
      # sources`; pinned to the version the contributors' toolchain uses.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.6

      - run: cargo xtask check

  # ──────────────────────────────────────────────────────────────────
  # TOML — taplo format-check.
  # ──────────────────────────────────────────────────────────────────
  toml:
    name: TOML (taplo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install taplo
        run: cargo install taplo-cli --locked --version 0.10.0
      - name: taplo format --check
        run: taplo format --check

  # ──────────────────────────────────────────────────────────────────
  # Markdown — markdownlint-cli2 + lychee link check.
  # ──────────────────────────────────────────────────────────────────
  markdown:
    name: Markdown (markdownlint / lychee)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@db43aef879112c3119a410d69f66701e0d530809 # v17
        with:
          config: .markdownlint-cli2.yaml
          globs: "**/*.md"

      - name: lychee — link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml '**/*.md'
          fail: true

  # ──────────────────────────────────────────────────────────────────
  # SQL — sqlfluff against the SQLite schema (crates/rekindle-db/schema).
  # ──────────────────────────────────────────────────────────────────
  sql:
    name: SQL (sqlfluff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: sqlfluff lint
        run: sqlfluff lint crates/rekindle-db/schema/

  # ──────────────────────────────────────────────────────────────────
  # Workflows — actionlint + zizmor (security audit).
  # ──────────────────────────────────────────────────────────────────
  workflows:
    name: Workflows (actionlint / zizmor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color -config-file .actionlint.yaml

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          # Read ignore rules from .zizmor.yml.

  # ──────────────────────────────────────────────────────────────────
  # Shell — shellcheck + shfmt against scripts/.
  # ──────────────────────────────────────────────────────────────────
  shell:
    name: Shell (shellcheck / shfmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: scripts

      - name: shfmt
        run: |
          # mvdan/sh's release assets are versioned in the filename
          # (shfmt_vX.Y.Z_linux_amd64). Pinned (resolving "latest" through
          # the API 404'd) and checked against the release's sha256sums.txt.
          SHFMT_VERSION=v3.12.0
          bin="shfmt_${SHFMT_VERSION}_linux_amd64"
          curl -sSfL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/${bin}" -o "${RUNNER_TEMP}/${bin}"
          echo "d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea  ${RUNNER_TEMP}/${bin}" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/${bin}" /usr/local/bin/shfmt
          shfmt -d -i 4 -ci -bn scripts/

  # ──────────────────────────────────────────────────────────────────
  # Nix — nixfmt + statix + deadnix + flake check.
  # ──────────────────────────────────────────────────────────────────
  nix:
    name: Nix (nixfmt / statix / deadnix / flake check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590 # main
      - uses: DeterminateSystems/magic-nix-cache-action@8941f279e15828abcd2fc8fbb7cd282ab00972a7 # main

      - name: nixfmt --check
        run: |
          nix shell nixpkgs#nixfmt --command find . -name '*.nix' -not -path './target/*' -not -path './node_modules/*' -exec nixfmt --check {} +

      - name: statix
        run: |
          nix shell nixpkgs#statix --command statix check .

      - name: deadnix
        run: |
          nix shell nixpkgs#deadnix --command deadnix --fail .

      - name: nix flake check
        run: nix flake check --accept-flake-config

  # ──────────────────────────────────────────────────────────────────
  # Typos — fast typo checker for source + docs.
  # ──────────────────────────────────────────────────────────────────
  typos:
    name: Typos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: crate-ci/typos@b41eb62e9a8096c9ba6636e2365d3f56018a203c # master

  # ──────────────────────────────────────────────────────────────────
  # Secrets — gitleaks history + working-tree scan.
  # ──────────────────────────────────────────────────────────────────
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 now gates organization accounts behind a paid
      # GITLEAKS_LICENSE secret — a vendor billing change, not a scan
      # requirement. The underlying `gitleaks` CLI stays fully open
      # source with no license check, so run it directly instead of
      # going through the Action wrapper.
      - name: Install gitleaks
        run: |
          # Pinned and checked against the release's checksums.txt.
          GITLEAKS_VERSION=8.30.1
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" -o "${RUNNER_TEMP}/${tarball}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          sudo tar -xzf "${RUNNER_TEMP}/${tarball}" -C /usr/local/bin gitleaks

      - name: gitleaks detect
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner -v

  # ──────────────────────────────────────────────────────────────────
  # Semgrep — SAST that covers the DAST patterns Tauri webview exposes:
  # innerHTML, eval, prototype pollution, deep-link sinks, crypto
  # primitives in TS land. Combines registry rulesets + custom rules
  # in .semgrep.yml.
  # ──────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-24.04
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: semgrep ci
        # Each registry ruleset needs its own `--config` flag — folding
        # them into one quoted, space-separated value made semgrep treat
        # the whole string as a single (nonexistent) registry path,
        # which 404s against semgrep.dev instead of resolving each pack.
        run: |
          semgrep \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/react \
            --config .semgrep.yml \
            --error \
            --metrics=off \
            --strict

  # ──────────────────────────────────────────────────────────────────
  # Cap'n Proto schemas — capnp compile validation.
  # ──────────────────────────────────────────────────────────────────
  capnp:
    name: Cap'n Proto (capnp compile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install capnp
        run: |
          sudo apt-get update
          sudo apt-get install -y capnproto
          # `-orust` runs the capnpc-rust plugin; the version build.rs uses
          # (Cargo.lock: capnpc 0.26.0), so the check compiles what the build does.
          cargo install capnpc --locked --version 0.26.0

      - name: capnp compile (validate every schema)
        run: |
          for f in schemas/*.capnp; do
            echo "::group::$f"
            capnp compile -orust:/tmp --src-prefix=schemas "$f"
            echo "::endgroup::"
          done
