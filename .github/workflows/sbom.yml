# SBOM generation — CycloneDX format for both Rust (cargo) and
# JavaScript (pnpm) ecosystems.
#
# Runs on every tag push and on workflow_dispatch. The generated SBOMs
# are uploaded as workflow artefacts and (on tag) attached to the
# GitHub Release. See docs/security/supply-chain-policy.md.

# Our own composite actions (.github/actions/<name>) are referenced as
# ScopeCreep-zip/Rekindle/.github/actions/<name>@<full 40-char sha>, never
# ./.github/actions/<name> (zizmor self-repository: a workspace path is not
# pinned and loads whatever the checkout holds). The sha is the latest
# commit that touches that action: after changing .github/actions/<name>,
# push that commit, then set every reference to
#   git log -1 --format=%H -- .github/actions/<name>
# in a follow-up commit (the pinned commit must already be on GitHub).

name: SBOM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  cargo-sbom:
    name: CycloneDX (Cargo)
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # attach the SBOM to the tag's release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: |
          cargo cyclonedx \
            --format json \
            --override-filename rekindle-cargo-sbom \
            --target-in-filename
        # The output lands at ./rekindle-cargo-sbom_<target>.cdx.json
        # alongside any per-crate SBOMs.

      - name: Upload as workflow artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rekindle-cargo-sbom
          path: |
            rekindle-cargo-sbom*.cdx.json
            target/cyclonedx/**/*.cdx.json
            **/bom.json

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(rekindle-cargo-sbom*.cdx.json)
          scripts/ci/attach-to-release.sh "${GITHUB_REF_NAME}" "${files[@]}"

  pnpm-sbom:
    name: CycloneDX (pnpm)
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # attach the SBOM to the tag's release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ScopeCreep-zip/Rekindle/.github/actions/setup-pnpm@7cf987f7e8b2f5b396fa467a3831db5c1055535b # action content as of 7cf987f7e

      - name: Generate SBOM
        # cdxgen pinned to an exact release (pnpm dlx fetches that version).
        run: |
          pnpm dlx @cyclonedx/cdxgen@12.9.0 \
            -t pnpm \
            -o rekindle-pnpm-sbom.cdx.json \
            --spec-version 1.6 \
            .

      - name: Upload as workflow artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rekindle-pnpm-sbom
          path: rekindle-pnpm-sbom.cdx.json

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/attach-to-release.sh "${GITHUB_REF_NAME}" rekindle-pnpm-sbom.cdx.json
