;--------------------------------Top Section
;--------------------------------------------Window1
[XfireTopRow]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=InfoOuterCG
Graphics.topleft=INFOVIEWTOPLEFT
Graphics.top=INFOVIEWTOP
Graphics.topright=INFOVIEWTOPRIGHT
Action.lbtndown=AppDragWindow
MinHeight=171
;--------------------------------Middle Section
;--------------------------------------------Window2
[XfireMiddleRow]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=InfoOuterCG
Graphics.left=INFOVIEWLEFT
Graphics.middle=INFOVIEWMIDDLE
Graphics.right=INFOVIEWRIGHT
Action.lbtndown=AppDragWindow
;--------------------------------------------Window3
[XfireBottomRow]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=InfoOuterCG
Graphics.bottomleft=INFOVIEWBOTTOMLEFT
Graphics.bottom=INFOVIEWBOTTOMMIDDLE
Graphics.bottomright=INFOVIEWBOTTOMRIGHT
Action.lbtndown=AppDragWindow
MinHeight=90
;--------------------------------------------Window4
[InfoViewButton]
Class=SkinLauncher
Graphics.ColorGroup=Hilight
Hover.ColorGroup=Hilight
BtnDown.ColorGroup=Hilight
Graphics.middle=INFOVIEWBUTTONRETRACT
Hover.middle=INFOVIEWBUTTONRETRACTHOVER
BtnDown.middle=INFOVIEWBUTTONRETRACTDOWN
Stretch=ToContent
Action.click=LaunchSkin
Accelerator=ALT(VK_LEFT)
Tooltip=RetractButtonTip
Cursor=Hand

Skin.Name=Infoskin
Skin.SaveState=1
;--------------------------------------------Window5
[BackDrop]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=InfoBackDropCG
Graphics.middle=IVBD
;--------------------------------------------Window6
[InfoView]
Class=InfoView
ColorGroup=InfoViewBG
Text.color=InfoViewText
Text.color_friend=InfoViewFriendText
Text.color_fof=InfoViewFofText
Text.color_recent=BuddyViewFriendText
Text.color_favorites=BuddyViewFofText
Text.color_friendsfavorites=FriendsFavoritesText
Text.color_all=AllServersText
Text.color_offline=InfoViewOfflineText
Text.color_hyperlink=InfoViewHyperlink
Text.font=Arial
Text.bold=true
;Text.size=11
Scrollbar=DefaultScrollbar
;--------------------------------------------Window7
[ResizeRight]
Class=Tile
MinWidth=10
Cursor=ResizeWE
Action.lbtndown=ResizeR
;--------------------------------Botom Section
;--------------------------------------------Window8
[ButtonHolder]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=MainCG
Graphics.middle=INFOVIEWBOTTOMBBG

Window1.Name=JoinChatTab
Window1.X=4
Window1.Y=3
Window1.Z=4

Window2.Name=JoinButton
Window2.X=81
Window2.Y=3
Window2.Z=4
;---------------------------Window1
[JoinButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanJoin
Disabled.Trigger=AppCannotJoin
Graphics.middle=BUTTONJOINNORMAL
Hover.middle=BUTTONJOINHOVER
Disabled.middle=BUTTONJOINDISABLED
BtnDown.middle=BUTTONJOINDOWN
Action.click=JoinFriend
Tooltip=GameButtonTip
DisabledTooltip=DisabledGameButtonTip
Cursor=Hand
