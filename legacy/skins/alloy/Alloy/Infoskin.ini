[JoinChatTab]
Class=TabControl
Stretch=ToContent
Graphics.middle=BUTTONVOICENORMAL
ControlGroupId=5
GroupId=5

Window1.Name=HostChatButton
Window1.ResizeX=100
Window1.ResizeY=100

Window2.Name=JoinChatButton
Window2.ResizeX=100
Window2.ResizeY=100

Window3.Name=LeaveChatButton
Window3.ResizeX=100
Window3.ResizeY=100

;no current hosted voice chat and we are allowed to host
Action.AppCanHostVoiceChat=GroupMessage(0)
;no current hosted voice chat and we are not allowed to host
Action.AppCannotVoiceChat=GroupMessage(0)

;someone is calling us
Action.AppCanVoiceChat=GroupMessage(1)

;current voice chat and we are allready joined. we may leave
Action.AppCanLeaveVoiceChat=GroupMessage(2)

[HostChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanHostVoiceChat
Disabled.Trigger=AppCannotVoiceChat
Graphics.middle=BUTTONVOICENORMAL
Hover.middle=BUTTONVOICEHOVER
Disabled.middle=BUTTONVOICEDISABLED
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppHostVoiceChat
Tooltip=CallButtonTip
DisabledTooltip=DisabledHostChatButtonTooltip
Cursor=Hand

[JoinChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanVoiceChat
Disabled.Trigger=AppCannotVoiceChat
Graphics.middle=MICRING
Hover.middle=BUTTONVOICEHOVER
Disabled.middle=BUTTONVOICEDISABLED
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppVoiceChat
Action.AppVoiceRinging=Animate(Type=Repeat,Delay=4,Repeat=10,Action=1)
Tooltip=AnswerButtonTip
DisabledTooltip=DisabledJoinChatTooltip
Cursor=Hand

[LeaveChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanVoiceChat
Graphics.middle=BUTTONVOICENORMAL
Hover.middle=BUTTONVOICEHOVER
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppLeaveVoiceChat
Tooltip=EndCallButtonTip
Cursor=Hand

Window1.Name=TalkingStateButton
Window1.Z=10

[TalkingStateButton]
Class=PushButton
Stretch=ToContent
events=Transparent
Graphics.ColorGroup=ButtonCG
Disabled.ColorGroup=VoiceTalkingShift
Graphics.Trigger=AppUserStoppedTalking
Disabled.Trigger=AppUserStartedTalking
Graphics.middle=BUTTONVOICETRANSPARENT
Disabled.middle=BUTTONVOICEHOVER
