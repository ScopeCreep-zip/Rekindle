Stretch=ToContent
Graphics.ColorGroup=MainCG
Graphics.middle=INFOVIEWBOTTOMBBG

Window1.Name=JoinChatTab
Window1.X=4
Window1.Y=3
Window1.Z=4

Window2.Name=JoinGameTab
Window2.X=81
Window2.Y=3
Window2.Z=4
;---------------------------Window1
[JoinGameTab]
Class=TabControl
Stretch=ToContent
;this graphics.middle is just to get the size correctly laid out
Graphics.middle=BUTTONJOINNORMAL
ControlGroupId=6
GroupId=6

Window1.Name=HostGameLobbyButton
Window1.ResizeX=100
Window1.ResizeY=100

Window2.Name=JoinGameLobbyButton
Window2.ResizeX=100
Window2.ResizeY=100

Window3.Name=LeaveGameLobbyButton
Window3.ResizeX=100
Window3.ResizeY=100

Window4.Name=LaunchGameLobbyButton
Window4.ResizeX=100
Window4.ResizeY=100

Window5.Name=DisabledGameLobbyButton
Window5.ResizeX=100
Window5.ResizeY=100


;in a group chat and there is no current game lobby and this user is allowed to select one
Action.AppCanHostGameLobby=GroupMessage(0)

;either in a game lobby and we can join or in the context of a friend that is playing a network game that is joinable for this user
Action.AppCanJoin=GroupMessage(1)

;in a group chat and in the game lobby and this user is NOT the host
Action.AppCanLeaveGameLobby=GroupMessage(2)

;in a group chat and this user IS the host
Action.AppCanLaunchGameLobby=GroupMessage(3)

;either in a game lobby and the button is disabled or in the context of a friend that is not playing a game that this user can join
Action.AppCannotJoin=GroupMessage(4)

[HostGameLobbyButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.middle=BUTTONJOINNORMAL
Hover.middle=BUTTONJOINHOVER
BtnDown.middle=BUTTONJOINDOWN
Action.click=HostGameLobby
Tooltip=HostGameLobbyButtonTip
Cursor=Hand

[JoinGameLobbyButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanJoin
Disabled.Trigger=AppCannotJoin
Graphics.middle=BUTTONJOINNORMAL
Hover.middle=BUTTONJOINHOVER
Disabled.middle=BUTTONJOINDISABLED
BtnDown.middle=BUTTONJOINDOWN
Action.click=JoinFriend
Tooltip=GameButtonTip
DisabledTooltip=DisabledGameButtonTip
Cursor=Hand

[LeaveGameLobbyButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.middle=BUTTONJOINNORMAL
Hover.middle=BUTTONJOINHOVER
BtnDown.middle=BUTTONJOINDOWN
Action.click=LeaveGameLobby
Tooltip=LeaveGameLobbyButtonTip
Cursor=Hand

[LaunchGameLobbyButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.middle=BUTTONJOINNORMAL
Hover.middle=BUTTONJOINHOVER
BtnDown.middle=BUTTONJOINDOWN
Action.click=LaunchGameLobby
Tooltip=LaunchGameLobbyButtonTip
Cursor=Hand

[DisabledGameLobbyButton]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Graphics.middle=BUTTONJOINDISABLED
Tooltip=DisabledGameButtonTip
Cursor=Hand

