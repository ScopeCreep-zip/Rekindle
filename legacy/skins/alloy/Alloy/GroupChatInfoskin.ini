[JoinChatTab]
Class=TabControl
Stretch=ToContent
Graphics.middle=BUTTONVOICENORMAL
ControlGroupId=1
GroupId=1

Window1.Name=HostChatButton
Window1.ResizeX=100
Window1.ResizeY=100

Window2.Name=JoinChatButton
Window2.ResizeX=100
Window2.ResizeY=100

Window3.Name=LeaveChatButton
Window3.ResizeX=100
Window3.ResizeY=100

Window4.Name=DisabledChatButton
Window4.ResizeX=100
Window4.ResizeY=100

;no current hosted voice chat and we are allowed to host
Action.AppCanHostVoiceChat=GroupMessage(0)
;no current hosted voice chat and we are not allowed to host
Action.AppCannotHostVoiceChat=GroupMessage(3)

;current voice chat and we are allowed to join (not allready joined)
Action.AppCanVoiceChat=GroupMessage(1)
;current voice chat and we are not allowed to join (not allready joined)
Action.AppCannotVoiceChat=GroupMessage(1)

;current voice chat and we are allready joined. we may leave
Action.AppCanLeaveVoiceChat=GroupMessage(2)

[HostChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanHostVoiceChat
Graphics.middle=BUTTONVOICENORMAL
Hover.middle=BUTTONVOICEHOVER
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppHostGroupVoiceChat
Tooltip=HostVoiceChatButtonTip
Cursor=Hand

[JoinChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanVoiceChat
Disabled.Trigger=AppCannotVoiceChat
Graphics.middle=BUTTONVOICENORMAL
Hover.middle=BUTTONVOICEHOVER
Disabled.middle=BUTTONVOICEDISABLED
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppGroupVoiceChat
;no ringing in group chats Action.AppVoiceRinging=Animate(Type=Repeat,Delay=4,Repeat=10)
Tooltip=JoinVoiceChatButtonTip
DisabledTooltip=DisabledJoinChatTooltip
Cursor=Hand

[LeaveChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.middle=BUTTONVOICENORMAL
Hover.middle=BUTTONVOICEHOVER
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppLeaveGroupVoiceChat
Tooltip=LeaveVoiceChatButtonTip
Cursor=Hand

