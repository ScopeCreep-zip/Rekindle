[Infoskin]
Class=Tile
DefaultWidth=150
DefaultHeight=100
MinWidth=150
MinHeight=100
ResizeX=0
ResizeY=100
BindX=false
BindY=true
;--------------------------------Main Window
Window1.Name=XfireTopRow
Window1.ResizeX=100
Window1.Z=2
Window1.IndentRight=13

Window2.Name=XfireMiddleRow
Window2.ResizeX=100
Window2.ResizeY=100
Window2.Y=126
Window2.IndentBottom=126
Window2.Z=1
Window2.IndentRight=13

Window3.Name=XfireBottomRow
Window3.ResizeX=100
Window3.JustY=BOTTOM
Window3.Z=2
Window3.IndentRight=13

Window4.Name=InfoViewButton
Window4.JustX=RIGHT
Window4.JustY=CENTER
Window4.Z=10

Window5.Name=BackDrop
Window5.X=13
Window5.Y=14
Window5.Z=1
Window5.IndentRight=26
Window5.IndentBottom=38
Window5.ResizeX=100
Window5.ResizeY=100

Window6.Name=InfoView
Window6.X=13
Window6.Y=14
Window6.Z=2
Window6.IndentRight=26
Window6.IndentBottom=38
Window6.ResizeX=100
Window6.ResizeY=100

Window7.Name=ResizeRight
Window7.JustX=RIGHT
Window7.X=13
Window7.ResizeY=100
Window7.Z=4

Window8.Name=ButtonHolder
Window8.JustX=CENTER
Window8.JustY=BOTTOM
Window8.OutdentLeft=7
Window8.IndentRight=7
Window8.Y=9
Window8.Z=3
;--------------------------------Top Section
;--------------------------------------------Window1
[XfireTopRow]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=InfoOuterCG
Graphics.topleft=INFOVIEWTOPLEFT
Graphics.top=INFOVIEWTOP
Graphics.topright=INFOVIEWTOPRIGHT
Action.lbtndown=AppDragWindow
MinHeight=126
;--------------------------------Middle Section
;--------------------------------------------Window2
[XfireMiddleRow]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=InfoOuterCG
Graphics.left=INFOVIEWLEFT
Graphics.middle=INFOVIEWMIDDLE
Graphics.right=INFOVIEWRIGHT
Action.lbtndown=AppDragWindow
;--------------------------------------------Window3
[XfireBottomRow]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=InfoOuterCG
Graphics.bottomleft=INFOVIEWBOTTOMLEFT
Graphics.bottom=INFOVIEWBOTTOMMIDDLE
Graphics.bottomright=INFOVIEWBOTTOMRIGHT
Action.lbtndown=AppDragWindow
MinHeight=126
;--------------------------------------------Window4
[InfoViewButton]
Class=SkinLauncher
Graphics.ColorGroup=Hilight
Hover.ColorGroup=Hilight
BtnDown.ColorGroup=Hilight
Graphics.middle=INFOVIEWBUTTONRETRACT
Hover.middle=INFOVIEWBUTTONRETRACTHOVER
BtnDown.middle=INFOVIEWBUTTONRETRACTDOWN
Stretch=ToContent
Action.click=LaunchSkin
Accelerator=ALT(VK_LEFT)
Tooltip=RetractButtonTip
Cursor=Hand

Skin.Name=Infoskin
Skin.SaveState=1
;--------------------------------------------Window5
[BackDrop]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=InfoBackDropCG
Graphics.middle=IVBD
;--------------------------------------------Window6
[InfoView]
Class=InfoView
ColorGroup=InfoViewBG
Text.color=InfoViewText
Text.color_friend=InfoViewFriendText
Text.color_fof=InfoViewFofText
Text.color_recent=BuddyViewFriendText
Text.color_favorites=BuddyViewFofText
Text.color_friendsfavorites=FriendsFavoritesText
Text.color_all=AllServersText
Text.color_offline=InfoViewOfflineText
Text.color_hyperlink=InfoViewHyperlink
Text.font=Arial
Text.bold=true
;Text.size=11
Scrollbar=DefaultScrollbar
;--------------------------------------------Window7
[ResizeRight]
Class=Tile
MinWidth=10
Cursor=ResizeWE
Action.lbtndown=ResizeR
;--------------------------------Botom Section
;--------------------------------------------Window8
[ButtonHolder]
Class=Tile
Stretch=ToContent
Graphics.ColorGroup=MainCG
Graphics.middle=INFOVIEWBOTTOMBBG

Window1.Name=JoinChatTab
Window1.X=0
Window1.Y=0
Window1.Z=4

Window2.Name=JoinButton
Window2.X=60
Window2.Y=0
Window2.Z=4
;---------------------------Window1
[JoinButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanJoin
Disabled.Trigger=AppCannotJoin
Graphics.middle=BUTTONJOINNORMAL
Hover.middle=BUTTONJOINHOVER
Disabled.middle=BUTTONJOINDISABLED
BtnDown.middle=BUTTONJOINDOWN
Action.click=JoinFriend
Tooltip=GameButtonTip
DisabledTooltip=DisabledGameButtonTip
Cursor=Hand
;---------------------------Window2
[JoinChatTab]
Class=TabControl
Stretch=ToContent
Graphics.middle=BUTTONVOICENORMAL
ControlGroupId=5
GroupId=5

Window1.Name=HostChatButton
Window1.ResizeX=100
Window1.ResizeY=100

Window2.Name=JoinChatButton
Window2.ResizeX=100
Window2.ResizeY=100

Window3.Name=LeaveChatButton
Window3.ResizeX=100
Window3.ResizeY=100

;no current hosted voice chat and we are allowed to host
Action.AppCanHostVoiceChat=GroupMessage(0)
;no current hosted voice chat and we are not allowed to host
Action.AppCannotVoiceChat=GroupMessage(0)

;someone is calling us
Action.AppCanVoiceChat=GroupMessage(1)

;current voice chat and we are allready joined. we may leave
Action.AppCanLeaveVoiceChat=GroupMessage(2)

[HostChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanHostVoiceChat
Disabled.Trigger=AppCannotVoiceChat
Graphics.middle=BUTTONVOICENORMAL
Hover.middle=BUTTONVOICEHOVER
Disabled.middle=BUTTONVOICEDISABLED
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppHostVoiceChat
Tooltip=CallButtonTip
DisabledTooltip=DisabledHostChatButtonTooltip
Cursor=Hand

[JoinChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanVoiceChat
Disabled.Trigger=AppCannotVoiceChat
Graphics.middle=MICRING
Hover.middle=BUTTONVOICEHOVER
Disabled.middle=BUTTONVOICEDISABLED
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppVoiceChat
Action.AppVoiceRinging=Animate(Type=Repeat,Delay=4,Repeat=10,Action=1)
Tooltip=AnswerButtonTip
DisabledTooltip=DisabledJoinChatTooltip
Cursor=Hand

[LeaveChatButton]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanVoiceChat
Graphics.middle=BUTTONVOICENORMAL
Hover.middle=BUTTONVOICEHOVER
BtnDown.middle=BUTTONVOICEDOWN
Action.click=AppLeaveVoiceChat
Tooltip=EndCallButtonTip
Cursor=Hand

Window1.Name=TalkingStateButton
Window1.Z=10

[TalkingStateButton]
Class=PushButton
Stretch=ToContent
events=Transparent
Graphics.ColorGroup=ButtonCG
Disabled.ColorGroup=VoiceTalkingShift
Graphics.Trigger=AppUserStoppedTalking
Disabled.Trigger=AppUserStartedTalking
Graphics.middle=BUTTONVOICETRANSPARENT
Disabled.middle=BUTTONVOICEHOVER
;VoiceTalkingShift

