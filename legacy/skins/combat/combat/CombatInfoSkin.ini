[CombatInfoSkin]
Class=Tile
MinWidth=173
MinHeight=100
ResizeX=0
ResizeY=100
BindX=false
BindY=true

Window1.Name=XfireTopRow
Window1.ResizeX=100

Window2.Name=XfireBottomRow
Window2.ResizeX=100
Window2.JustY=BOTTOM

Window3.Name=XfireMiddleRow
Window3.ResizeX=100
Window3.ResizeY=100
Window3.Y=XfireTopRow.BOTTOM
Window3.IndentBottom=XfireBottomRow.height

Window5.Name=BackDrop
Window5.ResizeX=100
Window5.ResizeY=100
Window5.X=0
Window5.Y=4
Window5.Z=-2
Window5.IndentRight=2
Window5.IndentBottom=4

Window6.Name=InfoView
Window6.Y=34
Window6.X=29
Window6.IndentRight=34
Window6.IndentBottom=56
Window6.ResizeX=100
Window6.ResizeY=100

Window7.Name=InfoGripperTR
Window7.JustX=RIGHT
Window7.Z=2

Window8.Name=InfoGripperBR
Window8.JustX=RIGHT
Window8.JustY=BOTTOM
Window8.Z=2

Window9.Name=ResizeRight
Window9.JustX=RIGHT
Window9.ResizeY=100
Window9.Z=4

Window10.Name=JoinButton
Window10.JustX=RIGHT
Window10.JustY=BOTTOM
Window10.Y=0
Window10.X=18
Window10.Z=3

Window11.Name=JoinChatButton
Window11.JustX=RIGHT
Window11.JustY=BOTTOM
Window11.Y=0
Window11.X=JoinButton.LEFT
Window11.X=0
Window11.Z=3

[XfireTopRow]
Class=Tile
Stretch=ToContent
Graphics.topleft=infoview/c_infoview_topleft.gif
Graphics.top=infoview/c_infoview_topmiddle.gif
Graphics.topright=infoview/c_infoview_topright.gif

[XfireBottomRow]
Class=Tile
Stretch=ToContent
Graphics.bottomleft=infoview/c_infoview_bottomleft.gif
Graphics.bottom=infoview/c_infoview_bottommiddle.gif
Graphics.bottomright=infoview/c_infoview_bottomright.gif

[XfireMiddleRow]
Class=Tile
Graphics.left=infoview/c_infoview_leftmiddle.gif
Graphics.right=infoview/c_infoview_rightmiddle.gif

[ResizeRight]
Class=Tile
MinWidth=5
Cursor=ResizeWE
Action.lbtndown=ResizeR

;careful with this. messing with black.gif sometimes makes skin look washed out
[BackDrop]
Class=Tile
Graphics.ColorGroup=DialogCG
Graphics.middle=middle.gif

[InfoView]
Class=InfoView
Text.color=InfoViewText
Text.color_friend=FriendofFriend
Text.color_fof=FriendofFriend
Text.color_offline=InfoViewOfflineText
Text.color_hyperlink=InfoViewHyperlink
Graphics.middle=c_background.gif
Scrollbar=DefaultScrollbar
ShowBevel=false

[InfoGripperTR]
Class=Tile
Graphics.ColorGroup=Hilight
Graphics.middle=INFOVIEWGRIPPERTOPRIGHT
Stretch=ToContent

[InfoGripperBR]
Class=Tile
Graphics.ColorGroup=Hilight
Graphics.middle=INFOVIEWGRIPPERBOTTOMRIGHT
Stretch=ToContent

[JoinButton]
Class=PushButton
Stretch=ToContent
Graphics.middle=infoview/c_infoview_button_join_norm.gif
Hover.middle=infoview/c_infoview_button_join_hover.gif
BtnDown.middle=infoview/c_infoview_button_join_down.gif
Disabled.middle=infoview/c_infoview_button_join_disabled.gif
Graphics.Trigger=AppCanJoin
Disabled.Trigger=AppCannotJoin
Action.click=JoinFriend
Tooltip=GameButtonTip
DisabledTooltip=DisabledGameButtonTip

[JoinChatButton]
Class=PushButton
Stretch=ToContent
Graphics.middle=infoview/c_infoview_button_voicechat_norm.gif
Hover.middle=infoview/c_infoview_button_voicechat_hover.gif
BtnDown.middle=infoview/c_infoview_button_voicechat_down.gif
Disabled.middle=infoview/c_infoview_button_voicechat_disabled.gif
Graphics.Trigger=AppCanVoiceChat
Disabled.Trigger=AppCannotVoiceChat
Action.click=AppVoiceChat
Tooltip=VoiceChatButtonTip
DisabledTooltip=DisabledJoinChatTooltip