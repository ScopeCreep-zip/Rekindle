;--------------Definitions

;---window1
[Top]
Class=Tile
Stretch=ToContent
Action.lbtndown=AppDragWindow
Graphics.topleft=chatskin/chat-topleft.gif
Graphics.top=chatskin/chat-topmiddle.gif
Graphics.topright=chatskin/chat-topright.gif
Disabled.topleft=chatskin/chat-topleft.gif
Disabled.top=chatskin/chat-topmiddle.gif
Disabled.topright=chatskin/chat-topright.gif
Action.deactivate=State(Disabled)
Action.activate=State(Normal)

;----window2
[UserNameField]
Class=Tile
Stretch=ToContent
events=Transparent

Window1.Name=UserNameText
Window1.X=14
Window1.Y=0

Window2.Name=TypingMessage
Window2.X=14
Window2.Y=UserNameText.TOP
Window2.Y=0

[UserNameText]
Class=Text
Stretch=ToContent
Text.text=UserNameText
Text.color=SkinText
Text.font=Arial
Text.bold=false
Text.size=11
events=Transparent

[TypingMessage]
Class=Text
Stretch=ToContent
Disabled.text=TypingMessage
Disabled.color=SkinTextLight
Disabled.font=Arial
Disabled.bold=false
Disabled.Trigger=ActiveUserTyping
Text.Trigger=ActiveUserNotTyping
events=Transparent

;----window3
[CloseBox]
Class=PushButton
Stretch=ToContent
Graphics.middle=chatskin\button-close-norm.gif
Hover.middle=chatskin\button-close-hover.gif
BtnDown.middle=chatskin\button-close-down.gif
Action.click=AppClose
Tooltip=Close Window

;-----Window4
[MinimizeBox]
Class=PushButton
Stretch=ToContent
Graphics.middle=chatskin\button-minimize-norm.gif
Hover.middle=chatskin\button-minimize-hover.gif
BtnDown.middle=chatskin\button-minimize-down.gif
Action.click=AppMinimize
Tooltip=MinimizeButtonTip

;--------window5
[TopBump]
Class=Tile
Stretch=ToContent
Graphics.middle=chatskin/top-bump.gif

;-------------------------------------------Middle
;----Window10
[Left]
Class=Tile
Stretch=ToContent
Graphics.middle=chatskin/chat-middleleft.gif
Action.lbtndown=AppDragWindow

;---Window11
[Middle]
Class=Tile
Stretch=ToContent
Graphics.middle=chatskin/mm.gif
Action.lbtndown=AppDragWindow

;-----Window12
[Right]
Class=Tile
Stretch=ToContent
Graphics.middle=chatskin/chat-middleright.gif
Action.lbtndown=AppDragWindow

;----Window13
[ChatArea]
Class=ChatArea
ColorGroup=ChatBack
Text.color_other=SkinTextUp
Text.color_othertext=SkinTextUp
Text.color_personal=SkinText
Text.color_personaltext=SkinText
Scrollbar=XglowScrollbar

;----Window14
[ViewInfoButton]
Class=SkinLauncher
;Default=click
Graphics.middle=buttons/viewinfo.gif
Hover.middle=buttons/viewinfo.gif
Stretch=ToContent
Action.click=LaunchSkin
Accelerator=ALT(VK_RIGHT)
Tooltip=ExpandButtonTip

Skin.Name=XGlowInfoSkin
Skin.X=Right.RIGHT
Skin.Y=30
Skin.Z=5


;----window15
[MiddleBump]
Class=Tile
Stretch=ToContent
Graphics.middle=chatskin/middle-bump.gif


;--------------------Botom
;---Window20
[Bottom]
Class=Tile
Stretch=ToContent
Graphics.bottomleft=chatskin/blc.gif
Graphics.bottom=chatskin/bb.gif
Graphics.bottomright=chatskin/brc.gif
Action.lbtndown=AppDragWindow

;----Window21
[ChatEdit]
Class=ChatEdit
WindowFocus=true
ColorGroup=Black
Text.color=SkinText
Scrollbar=XglowScrollbar

;----Window22
[Send]
Class=PushButton
Stretch=ToContent
Graphics.Trigger=AppCanProfile
Disabled.Trigger=AppCannotProfile
Graphics.middle=chatskin/chat.gif
Hover.middle=chatskin/chat-hover.gif
Disabled.middle=chatskin/nochat.gif
BtnDown.middle=chatskin/chat-down.gif
Action.click=SendMessage
Tooltip=SendMessageTip

;----Window23
[Gripper]
Class=Tile
Stretch=ToContent
Cursor=ResizeNWSE
Action.lbtndown=ResizeBR
Graphics.middle=chatskin/gripper.gif

;-----window24
[BottomBump]
Class=Tile
Stretch=ToContent
Graphics.middle=chatskin/bottom-bump.gif