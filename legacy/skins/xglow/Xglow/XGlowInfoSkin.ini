;-----------------------*****Diffinition*************
;--------------------------Window1
[Top]
Class=Tile
Stretch=ToContent
Graphics.topleft=infoskin/ulc.gif
Graphics.top=infoskin/ut.gif
Graphics.topright=infoskin/urc.gif
Action.lbtndown=AppDragWindow

;------------------Middle Section

;----Window10
[Left]
Class=Tile
Stretch=ToContent
Graphics.middle=infoskin/ml.gif

;----window11
[Middle]
Class=Tile
Stretch=ToContent
Graphics.middle=infoskin\mm.gif

;----window12
[Right]
Class=Tile
Stretch=ToContent
Graphics.right=infoskin/mr.gif

;----window13
[InfoView]
Class=InfoView
Transparency=true
ColorGroup=Black
Text.color=SkinText
Text.color_friend=Label
Text.color_fof=Label
Text.color_recent=Label
Text.color_favorites=Label
Text.color_friendsfavorites=Label
Text.color_all=Label
Text.color_offline=Label
Text.color_hyperlink=Label
Text.font=Arial
Text.size=10
Scrollbar=XglowScrollbar

;----------------------Bottom Section
;---Window20
[Bottom]
Class=Tile
Stretch=ToContent
Graphics.bottomleft=infoskin/blc.gif
Graphics.bottom=infoskin/bb.gif
Graphics.bottomright=infoskin/brc.gif

;-----window21
[Gripper]
Class=Tile
Stretch=ToContent
Cursor=ResizeNWSE
Action.lbtndown=ResizeBR
Graphics.middle=infoskin/gripper.gif

;----window22
[Bump]
Class=Tile
Stretch=ToContent
Graphics.middle=infoskin/bump.gif

;-------Window23
[Voice]
Class=PushButton
Stretch=ToContent
Graphics.ColorGroup=ButtonCG
Hover.ColorGroup=ButtonCG
Disabled.ColorGroup=ButtonCG
BtnDown.ColorGroup=ButtonCG
Graphics.Trigger=AppCanVoiceChat
Disabled.Trigger=AppCannotVoiceChat
Graphics.middle=infoskin/voice.gif
Hover.middle=infoskin/voice-hover.gif
BtnDown.middle=infoskin/voice-down.gif
Disabled.middle=infoskin/novoice.gif
Action.click=AppVoiceChat
Tooltip=VoiceChatButtonTip

;-----window24
[Join]
Class=PushButton
Stretch=ToContent
Graphics.Trigger=AppCanJoin
Disabled.Trigger=AppCannotJoin
Graphics.middle=infoskin/join.gif
BtnDown.middle=infoskin/join-down.gif
Hover.middle=infoskin/join-hover.gif
Disabled.middle=infoskin/nojoin.gif
Action.click=JoinFriend
Tooltip=GameButtonTip


